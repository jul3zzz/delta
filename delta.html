        '<td class="mono">' + x.note + ' / 50</td>' +
        '<td class="mono">' + new Date(x.d).toLocaleDateString('fr-FR') + '</td></tr>').join('') +
      '</tbody></table></div>' : '');

  $$('[data-b]').forEach(b => b.onclick = () => go('brevet/' + b.dataset.b));
};

function brevetRun(host, id) {
  const sujet = BREVETS.find(b => b.id === id);
  if (!BR || BR.id !== id || BR.fini) {
    BR = { id: id, debut: Date.now(), rep: {}, fini: false };
  }
  const total = sujet.duree * 60;

  const qs = [];
  sujet.ex.forEach((ex, ei) => ex.qs.forEach((q, qi) => qs.push({ ex: ei, qi: qi, q: q, key: ei + '-' + qi })));

  host.innerHTML = '<div class="pagehead"><div class="grow">' +
    '<div class="eyebrow">' + esc(sujet.t) + '</div><h1>Histoire · Géographie · EMC</h1>' +
    '<p>' + esc(sujet.st) + ' — 2 heures, 50 points. Compose dans l’ordre que tu veux, puis rends ta copie.</p></div>' +
    '<button class="btn ghost" id="quit">Abandonner</button></div>' +
    '<div class="exam"><div id="copie"></div>' +
    '<aside class="panel" style="position:sticky;top:70px">' +
    '<div class="eyebrow">Temps restant</div><div class="timer" id="tm">2:00:00</div>' +
    '<div class="bar" style="margin:12px 0"><i id="tbar" style="width:100%"></i></div>' +
    '<div class="eyebrow" style="margin-top:14px">Avancement</div>' +
    '<div class="mono small" id="av" style="margin:4px 0 12px">0 / ' + qs.length + ' questions</div>' +
    '<button class="btn p wide" id="rendre">Rendre la copie</button>' +
    '<p class="small muted" style="margin-top:10px;font-size:12px;font-family:var(--ff-b)">Les développements construits seront auto-évalués : tu compareras ta réponse à un corrigé type et tu cocheras les éléments que tu as traités.</p>' +
    '</aside></div>';

  const copie = $('#copie');
  sujet.ex.forEach((ex, ei) => {
    const blocs = document.createElement('div');
    blocs.className = 'panel';
    blocs.style.marginBottom = '18px';
    blocs.innerHTML = '<div class="row" style="margin-bottom:6px">' +
      '<span class="pill ' + MAT[ex.disc].cls + '">' + MAT[ex.disc].n + '</span>' +
      '<b style="font-size:17px">' + esc(ex.n) + '</b><span class="grow"></span>' +
      '<span class="mono small muted">' + ex.pts + ' points</span></div>' +
      '<p class="small muted" style="font-family:var(--ff-b);margin-bottom:6px"><em>' + esc(ex.tt) + '</em></p>' +
      '<p style="font-family:var(--ff-b);margin-bottom:12px">' + esc(ex.cons) + '</p>' +
      (ex.docs || []).map(d => d.fig
        ? '<div class="docsrc" style="background-image:none"><div class="dt">' + esc(d.t) + '</div>' + figSVG(d.fig, d.w, d.h) + (d.src ? '<div class="src">' + esc(d.src) + '</div>' : '') + '</div>'
        : '<div class="docsrc"><div class="dt">' + esc(d.t) + '</div><blockquote>' + esc(d.txt) + '</blockquote>' + (d.src ? '<div class="src">' + esc(d.src) + '</div>' : '') + '</div>').join('') +
      ex.qs.map((q, qi) => '<div class="qbloc" data-k="' + ei + '-' + qi + '">' +
        '<span class="pts">' + q.p + ' pt' + (q.p > 1 ? 's' : '') + '</span>' +
        '<span class="qnum">QUESTION ' + (qi + 1) + '</span>' +
        '<p style="font-family:var(--ff-b);font-size:16px;margin:6px 0 10px">' + q.q + '</p>' +
        '<div class="zone"></div></div>').join('');
    copie.appendChild(blocs);
  });

  qs.forEach(item => {
    const bloc = $('[data-k="' + item.key + '"]', copie), zone = $('.zone', bloc), q = item.q;
    if (q.ty === 'qcm') {
      zone.innerHTML = '<div class="opts">' + q.o.map((o, k) => '<button class="opt" data-k="' + k + '"><span class="mk">' + 'ABCD'[k] + '</span><span>' + esc(o) + '</span></button>').join('') + '</div>';
      $$('.opt', zone).forEach(b => b.onclick = () => {
        $$('.opt', zone).forEach(o => o.classList.remove('sel'));
        b.classList.add('sel'); BR.rep[item.key] = +b.dataset.k; maj();
      });
    } else if (q.ty === 'txt') {
      zone.innerHTML = '<input class="txtin" placeholder="Ta réponse…" autocomplete="off">';
      $('input', zone).oninput = e => { BR.rep[item.key] = e.target.value; maj(); };
    } else if (q.ty === 'ord') {
      zone.innerHTML = '<p class="small muted">Clique dans l’ordre chronologique.</p>' +
        '<div class="friserow pool">' + shuffle(q.o.map((x, k) => [x, k])).map(p => '<button class="frisecard" data-o="' + p[1] + '">' + esc(p[0]) + '</button>').join('') + '</div>' +
        '<div class="slotrow ch" style="min-height:38px"></div>';
      const ch = [];
      $$('.frisecard', zone).forEach(b => b.onclick = () => {
        b.style.display = 'none'; ch.push(+b.dataset.o);
        $('.ch', zone).innerHTML = ch.map((k, p) => '<span class="frisecard on"><span class="yr">' + (p + 1) + '</span>' + esc(q.o[k]) + '</span>').join('');
        BR.rep[item.key] = ch.slice(); maj();
      });
    } else if (q.ty === 'carte') {
      const zones = mapZones(q.map, 0, 0, 2.3);
      zone.innerHTML = '<div class="row" style="gap:6px;margin-bottom:8px" id="lab-' + item.key + '"></div>' +
        '<div class="mapgame"><svg viewBox="0 0 236 240" xmlns="http://www.w3.org/2000/svg">' +
        (CARTES_BASE[q.map].mer ? '<rect x="0" y="0" width="236" height="240" fill="' + col('mer') + '"/>' : '') +
        zones.map(z => z.contours.map(pt => '<polygon class="zone" data-c="' + z.c + '" points="' + pt + '" fill="' + col('terre') + '" stroke="' + col('l') + '" stroke-width="1"/>').join('')).join('') +
        '</svg></div>';
      const rep = BR.rep[item.key] = BR.rep[item.key] || {};
      let cur = 0;
      const majLab = () => {
        $('#lab-' + item.key).innerHTML = q.items.map((it, k) =>
          '<span class="pill ' + (rep[it[0]] ? 't-ok' : (k === cur ? 't-bad' : 't-neutral')) + '">' + esc(it[0]) + '</span>').join('');
      };
      majLab();
      $$('polygon.zone', zone).forEach(p => p.onclick = () => {
        if (cur >= q.items.length) return;
        rep[q.items[cur][0]] = p.dataset.c;
        p.style.fill = col('b:40');
        cur++; majLab(); maj();
      });
    } else if (q.ty === 'red') {
      zone.innerHTML = '<textarea class="txtin" rows="8" placeholder="Rédige ta réponse ici…" style="font-family:var(--ff-b);line-height:1.6"></textarea>' +
        '<div class="small muted mono" style="margin-top:4px"><span class="cnt">0</span> mots</div>';
      const ta = $('textarea', zone);
      ta.oninput = () => {
        BR.rep[item.key] = ta.value;
        $('.cnt', zone).textContent = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
        maj();
      };
    }
  });

  function maj() {
    const n = qs.filter(x => {
      const v = BR.rep[x.key];
      if (v == null) return false;
      if (typeof v === 'string') return v.trim().length > 0;
      if (Array.isArray(v)) return v.length > 0;
      if (typeof v === 'object') return Object.keys(v).length > 0;
      return true;
    }).length;
    $('#av').textContent = n + ' / ' + qs.length + ' questions';
  }
  maj();

  const tick = setInterval(() => {
    if (!$('#tm')) { clearInterval(tick); return; }
    const rest = total - Math.floor((Date.now() - BR.debut) / 1000);
    if (rest <= 0) { clearInterval(tick); corriger(); return; }
    const h = Math.floor(rest / 3600), m = Math.floor(rest % 3600 / 60), s = rest % 60;
    const el = $('#tm');
    el.textContent = h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    el.className = 'timer' + (rest < 300 ? ' crit' : rest < 900 ? ' warn' : '');
    $('#tbar').style.width = Math.max(0, 100 * rest / total) + '%';
  }, 1000);

  $('#quit').onclick = () => { if (confirm('Abandonner cette épreuve ? Tes réponses seront perdues.')) { BR = null; clearInterval(tick); go('brevet'); } };
  $('#rendre').onclick = () => { if (confirm('Rendre la copie et voir la correction ?')) { clearInterval(tick); corriger(); } };

  function corriger() {
    BR.fini = true;
    let note = 0;
    const autoEval = [];
    let out = '';

    sujet.ex.forEach((ex, ei) => {
      let ptsEx = 0;
      let bloc = '<div class="panel" style="margin-bottom:18px"><div class="row" style="margin-bottom:10px">' +
        '<span class="pill ' + MAT[ex.disc].cls + '">' + MAT[ex.disc].n + '</span><b>' + esc(ex.n) + '</b>' +
        '<span class="grow"></span><span class="mono small" id="pts-' + ei + '"></span></div>';

      ex.qs.forEach((q, qi) => {
        const key = ei + '-' + qi, v = BR.rep[key];
        let gagne = 0, detail = '';
        if (q.ty === 'qcm') {
          gagne = (v === q.r) ? q.p : 0;
          detail = '<div class="fb ' + (gagne ? 'ok' : 'no') + '"><b>' + (gagne ? '✓' : '✕') + '</b><span class="why">' +
            'Réponse attendue : <strong>' + esc(q.o[q.r]) + '</strong>. ' + (q.w || '') + '</span></div>';
        } else if (q.ty === 'txt') {
          const good = v && q.r.some(a => norm(a) === norm(v));
          gagne = good ? q.p : 0;
          detail = '<div class="fb ' + (good ? 'ok' : 'no') + '"><b>' + (good ? '✓' : '✕') + '</b><span class="why">' +
            'Ta réponse : « ' + esc(v || '—') + ' ». Attendu : <strong>' + esc(q.r[0]) + '</strong>. ' + (q.w || '') + '</span></div>';
        } else if (q.ty === 'ord') {
          const bon = Array.isArray(v) && v.length === q.o.length && v.every((k, p) => k === p);
          const justes = Array.isArray(v) ? v.filter((k, p) => k === p).length : 0;
          gagne = bon ? q.p : Math.round(q.p * justes / q.o.length * .5);
          detail = '<div class="fb ' + (bon ? 'ok' : 'no') + '"><b>' + (bon ? '✓' : '✕') + '</b><span class="why">' +
            'Ordre attendu : ' + q.o.map((x, k) => (k + 1) + '. ' + esc(x)).join(' · ') + '. ' + (q.w || '') + '</span></div>';
        } else if (q.ty === 'carte') {
          const rep = v || {};
          const justes = q.items.filter(it => rep[it[0]] === it[1]).length;
          gagne = Math.round(q.p * justes / q.items.length);
          detail = '<div class="fb ' + (justes === q.items.length ? 'ok' : 'no') + '"><b>' + justes + ' / ' + q.items.length + '</b>' +
            '<span class="why">' + q.items.map(it => {
              const ok = rep[it[0]] === it[1];
              return '<span class="pill ' + (ok ? 't-ok' : 't-bad') + '" style="margin:2px 3px 0 0">' + esc(it[0]) + '</span>';
            }).join('') + '<br>' + (q.w || '') + '</span></div>';
        } else if (q.ty === 'red') {
          const txt = (v || '').trim();
          const mots = txt ? txt.split(/\s+/).length : 0;
          detail = '<div class="modelans"><b style="font-family:var(--ff-d);display:block;margin-bottom:6px">Corrigé type — coche ce que tu as vraiment traité</b>' +
            '<ul>' + q.mod.map((m, mi) => '<li><label style="cursor:pointer"><input type="checkbox" class="se" data-k="' + key + '" data-mi="' + mi + '"> ' + m + '</label></li>').join('') + '</ul>' +
            '<p class="small muted" style="margin-top:8px">Ta copie fait ' + mots + ' mot(s). Chaque élément coché vaut ' + (q.p / q.mod.length).toFixed(1) + ' point.</p></div>' +
            (txt ? '<details style="margin-top:8px"><summary class="small muted" style="cursor:pointer">Relire ma réponse</summary>' +
              '<p style="font-family:var(--ff-b);white-space:pre-wrap;margin-top:8px;padding:10px;background:var(--surface2);border-radius:6px">' + esc(txt) + '</p></details>'
              : '<p class="small" style="color:var(--bad);margin-top:6px">Aucune réponse rédigée.</p>');
          autoEval.push({ key: key, p: q.p, n: q.mod.length });
        }
        ptsEx += gagne;
        bloc += '<div class="qbloc"><span class="pts">' + (q.ty === 'red' ? '?' : gagne) + ' / ' + q.p + '</span>' +
          '<span class="qnum">QUESTION ' + (qi + 1) + '</span>' +
          '<p style="font-family:var(--ff-b);margin:6px 0 8px">' + q.q + '</p>' + detail + '</div>';
      });
      note += ptsEx;
      bloc += '</div>';
      out += bloc.replace('id="pts-' + ei + '"></span>', 'id="pts-' + ei + '">' + ptsEx + ' / ' + ex.pts + '</span>');
    });

    host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Correction — ' + esc(sujet.t) + '</div>' +
      '<h1>Ta copie</h1><p>Les questions fermées sont déjà corrigées. Coche dans les corrigés types les éléments que tu as réellement traités pour obtenir ta note finale.</p></div>' +
      '<div class="stack center" style="align-items:center"><div class="score" id="note">' + note + '</div>' +
      '<span class="small muted">sur 50</span></div></div>' + out +
      '<div class="panel center" style="margin-top:8px">' +
      '<p style="font-family:var(--ff-b);margin-bottom:12px">Quand tu as fini de t’auto-évaluer, valide ta note.</p>' +
      '<div class="row" style="justify-content:center"><button class="btn p big" id="valider">Valider ma note</button>' +
      '<button class="btn" id="retour">Retour aux sujets</button></div></div>';

    const base = note;
    const recalc = () => {
      let bonus = 0;
      autoEval.forEach(a => {
        const coches = $$('.se[data-k="' + a.key + '"]:checked').length;
        bonus += a.p * coches / a.n;
      });
      $('#note').textContent = Math.round(base + bonus);
      return Math.round(base + bonus);
    };
    $$('.se').forEach(c => c.onchange = recalc);
    $('#retour').onclick = () => { BR = null; go('brevet'); };
    $('#valider').onclick = () => {
      const fin = recalc();
      S.brevets.push({ id: sujet.id, note: fin, d: Date.now() });
      S.stats.brevet = (S.stats.brevet || 0) + 1;
      const d = elo(4, fin >= 30, 26);
      gain(fin * 8, fin * 5);
      commit(); checkSucces();
      if (fin >= 30) burstAt(innerWidth / 2, 200, fin >= 40 ? 110 : 60);
      modal('<div class="center"><div class="eyebrow">Note enregistrée</div>' +
        '<div class="score" style="margin:14px 0;color:' + (fin >= 30 ? 'var(--ok)' : 'var(--bad)') + '">' + fin + ' / 50</div>' +
        '<p style="font-family:var(--ff-b);margin-bottom:10px">' +
        (fin >= 45 ? 'Excellent — c’est le niveau d’une très bonne copie.' :
          fin >= 40 ? 'Très bonne copie : tu vises la mention.' :
            fin >= 30 ? 'Copie solide. Retravaille les points manqués et tu gagneras encore.' :
              fin >= 20 ? 'Il manque des connaissances précises : reprends les chapitres concernés.' :
                'Reprends les cours avant de refaire un sujet : les repères et le vocabulaire sont indispensables.') + '</p>' +
        '<p class="muted small">+' + (fin * 8) + ' δ · +' + (fin * 5) + ' XP · ' + eloTag(d) + '</p></div>');
      BR = null;
    };
  }
}

</script>
<script>
/* ============================================================
   Delta — profil, boutique, succes.
   ============================================================ */
function avatarSVG(id, size) {
  const a = shopFind('avatar', id) || SHOP.avatar[0];
  return '<svg viewBox="0 0 64 64" width="' + (size || 56) + '" height="' + (size || 56) + '" xmlns="http://www.w3.org/2000/svg">' +
    a.ops.map(o => (OPS[o[0]] ? OPS[o[0]](o) : '')).join('') + '</svg>';
}
function titreDe() { const t = shopFind('title', S.shop.eq.title); return t ? t.n : 'Élève de 3ᵉ'; }

function pcardHTML() {
  const ban = shopFind('banner', S.shop.eq.banner), fr = shopFind('frame', S.shop.eq.frame);
  const bk = shopFind('back', S.shop.eq.back), li = levelInfo(), r = rang(S.elo);
  return '<div class="pcard" style="' + (bk ? bk.css : '') + '">' +
    '<div class="bg" style="' + (ban ? ban.css : '') + '"></div>' +
    '<div class="ava" style="' + (fr ? fr.css : '') + '">' + avatarSVG(S.shop.eq.avatar, 76) + '</div>' +
    '<div><h2 style="margin-bottom:2px">' + esc(USER) + '</h2>' +
    '<div class="eyebrow" style="margin-bottom:8px">' + esc(titreDe()) + '</div>' +
    '<div class="row" style="gap:8px"><span class="stat">Niv. ' + li.n + '</span>' +
    '<span class="stat elo">' + r.g + ' ' + esc(r.n) + ' · ' + S.elo + '</span>' +
    '<span class="stat coin"><b>' + nfmt(S.coins) + '</b> δ</span></div>' +
    '<div class="bar" style="margin-top:10px;max-width:320px"><i style="width:' + li.pct + '%"></i></div>' +
    '</div></div>';
}

/* ============================================================
   PROFIL
   ============================================================ */
VIEWS.profil = function (host) {
  const nc = Object.keys(S.cours).length, ne = Object.keys(S.exos).filter(k => S.exos[k].ok).length;
  const nf = Object.keys(S.cards).length, ns = Object.keys(S.succes).length;
  const best = S.brevets.length ? Math.max.apply(null, S.brevets.map(b => b.note)) : null;
  const tauxE = S.stats.exoTot ? Math.round(100 * S.stats.exoOk / S.stats.exoTot) : 0;

  host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Profil</div>' +
    '<h1>Ton profil</h1><p>Ta progression, tes équipements et tes statistiques. Tout est enregistré dans ce navigateur.</p></div>' +
    '<button class="btn p" onclick="go(\'boutique\')">Personnaliser</button></div>' +

    pcardHTML() +

    '<div class="tiles" style="margin:18px 0">' +
    '<div><b>' + nc + '</b><span>chapitres lus</span></div>' +
    '<div><b>' + ne + '</b><span>exercices réussis</span></div>' +
    '<div><b>' + tauxE + ' %</b><span>de réussite</span></div>' +
    '<div><b>' + (S.stats.jeux || 0) + '</b><span>parties jouées</span></div>' +
    '<div><b>' + nf + '</b><span>fiches obtenues</span></div>' +
    '<div><b>' + ns + '</b><span>succès</span></div>' +
    '<div><b>' + (best != null ? best + '/50' : '—') + '</b><span>meilleur brevet</span></div>' +
    '<div><b>' + (S.streak.best || 0) + '</b><span>meilleure série</span></div>' +
    '</div>' +

    '<div class="grid g2">' +
    '<div class="panel"><b>Progression par matière</b><div class="stack" style="gap:12px;margin-top:12px">' +
    ['hist', 'geo', 'emc'].map(m => {
      const l = coursDe(m), f = l.filter(c => S.cours[c.id]).length;
      const ex = EXOS.filter(e => e.m === m), exo = ex.filter(e => S.exos[e.id] && S.exos[e.id].ok).length;
      return '<div><div class="barlab"><span>' + MAT[m].n + '</span><span>' + f + '/' + l.length + ' cours · ' + exo + '/' + ex.length + ' exos</span></div>' +
        '<div class="bar ' + m + '"><i style="width:' + Math.round(100 * (f + exo) / (l.length + ex.length)) + '%"></i></div></div>';
    }).join('') + '</div></div>' +

    '<div class="panel"><b>Classement Elo</b>' +
    '<p class="small muted" style="font-family:var(--ff-b);margin:8px 0 12px">Ton Elo monte quand tu réussis un exercice difficile et descend quand tu rates un exercice facile.</p>' +
    '<div class="stack" style="gap:4px">' + RANGS.map(r => {
      const on = S.elo >= r.e, cur = rang(S.elo).n === r.n;
      return '<div class="badge' + (on ? '' : ' off') + '"' + (cur ? ' style="border-color:var(--brand);background:var(--brand-soft)"' : '') + '>' +
        '<i>' + r.g + '</i><span style="flex:1"><b>' + esc(r.n) + '</b><span>à partir de ' + r.e + ' points</span></span>' +
        (cur ? '<span class="pill t-ok">actuel</span>' : '') + '</div>';
    }).join('') + '</div></div></div>' +

    '<div class="panel" style="margin-top:18px"><b>Données du compte</b>' +
    '<p class="small muted" style="font-family:var(--ff-b);margin:8px 0 12px">Compte créé le ' + new Date(S.created).toLocaleDateString('fr-FR') +
    '. Tout est stocké dans le <code>localStorage</code> de ce navigateur : rien n’est envoyé sur Internet.</p>' +
    '<div class="row"><button class="btn" id="exp">Exporter ma progression</button>' +
    '<button class="btn" id="imp">Importer une sauvegarde</button>' +
    '<button class="btn" id="raz" style="color:var(--bad)">Réinitialiser ce compte</button></div></div>';

  $('#exp').onclick = () => {
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    modal('<h2>Exporter</h2><p class="small muted" style="font-family:var(--ff-b);margin:8px 0">Copie ce code et garde-le : il contient toute ta progression.</p>' +
      '<textarea class="txtin" rows="6" readonly style="font-family:var(--ff-m);font-size:11px">' + data + '</textarea>');
  };
  $('#imp').onclick = () => {
    modal('<h2>Importer</h2><p class="small muted" style="font-family:var(--ff-b);margin:8px 0">Colle ici un code d’export. Attention : cela remplacera ta progression actuelle.</p>' +
      '<textarea class="txtin" id="impdata" rows="6" style="font-family:var(--ff-m);font-size:11px"></textarea>' +
      '<button class="btn p wide" id="impgo" style="margin-top:10px">Importer</button>', () => {
        $('#impgo').onclick = () => {
          try {
            const o = JSON.parse(decodeURIComponent(escape(atob($('#impdata').value.trim()))));
            if (!o || typeof o !== 'object' || !('coins' in o)) throw new Error('format');
            DB.users[USER].save = o; login(USER); commit(); closeModal();
            toast('Progression importée', 'win'); renderApp();
          } catch (e) { toast('Code invalide'); }
        };
      });
  };
  $('#raz').onclick = () => {
    if (!confirm('Effacer toute la progression de ce compte ? C’est définitif.')) return;
    if (!confirm('Vraiment sûr ? Tous les cours, fiches et succès seront perdus.')) return;
    DB.users[USER].save = blankSave(); login(USER); commit(); renderApp();
    toast('Compte réinitialisé');
  };
};

/* ============================================================
   BOUTIQUE
   ============================================================ */
VIEWS.boutique = function (host, args) {
  const cat = SHOPCATS.some(c => c[0] === args[0]) ? args[0] : 'theme';
  const info = SHOPCATS.find(c => c[0] === cat);

  const preview = (cat, o) => {
    if (cat === 'theme') {
      const v = o.vars ? o.vars[effTheme()] : null;
      const bg = v ? v['--surface'] : 'var(--surface)', ink = v ? v['--ink'] : 'var(--ink)', br = v ? v['--brand'] : 'var(--brand)';
      return '<div style="width:100%;height:100%;background:' + bg + ';display:flex;align-items:center;justify-content:center;gap:6px">' +
        '<span style="width:22px;height:22px;border-radius:5px;background:' + br + '"></span>' +
        '<span style="width:44px;height:8px;border-radius:99px;background:' + ink + ';opacity:.75"></span></div>';
    }
    if (cat === 'avatar') return avatarSVG(o.id, 58);
    if (cat === 'banner') return '<div style="width:100%;height:100%;' + o.css + '"></div>';
    if (cat === 'frame') return '<div style="width:46px;height:46px;border-radius:50%;background:var(--surface2);' + o.css + '"></div>';
    if (cat === 'title') return '<span style="font-family:var(--ff-d);font-weight:700;font-size:13px;text-align:center;padding:0 8px">' + esc(o.n) + '</span>';
    if (cat === 'back') return '<div style="width:100%;height:100%;background:var(--surface2);' + o.css + '"></div>';
    return '';
  };

  host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Boutique</div>' +
    '<h1>Boutique</h1><p>Dépense tes δ pour personnaliser ton profil et repeindre l’interface. Les thèmes changent l’apparence complète du site, en clair comme en sombre.</p></div>' +
    '<span class="stat coin"><b>' + nfmt(S.coins) + '</b> δ</span></div>' +

    pcardHTML() +

    '<div class="tabs" style="margin:18px 0">' + SHOPCATS.map(c =>
      '<button data-cat="' + c[0] + '" class="' + (cat === c[0] ? 'on' : '') + '">' + esc(c[1]) + '</button>').join('') + '</div>' +
    '<p class="small muted" style="font-family:var(--ff-b);margin-bottom:14px">' + esc(info[2]) + '</p>' +

    '<div class="grid g3">' + SHOP[cat].map(o => {
      const owned = S.shop.owned.indexOf(o.id) >= 0, eq = S.shop.eq[cat] === o.id;
      return '<div class="shopitem"' + (eq ? ' style="border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)"' : '') + '>' +
        '<div class="prev">' + preview(cat, o) + '</div>' +
        '<h4>' + esc(o.n) + '</h4>' +
        (o.d ? '<p class="small muted" style="font-family:var(--ff-b);font-size:12px">' + esc(o.d) + '</p>' : '') +
        (eq ? '<span class="pill t-ok">équipé</span>'
          : owned ? '<button class="btn sm" data-eq="' + o.id + '">Équiper</button>'
            : '<button class="btn sm p" data-buy="' + o.id + '">' + (o.prix ? o.prix + ' δ' : 'Gratuit') + '</button>') +
        (!owned ? '<span class="price">' + (o.prix ? nfmt(o.prix) + ' δ' : 'offert') + '</span>' : '') +
        '</div>';
    }).join('') + '</div>';

  $$('[data-cat]').forEach(b => b.onclick = () => go('boutique/' + b.dataset.cat));
  $$('[data-buy]').forEach(b => b.onclick = () => {
    const o = shopFind(cat, b.dataset.buy);
    if (!spend(o.prix)) return;
    S.shop.owned.push(o.id); S.shop.eq[cat] = o.id;
    commit(); applySkin(); checkSucces();
    toast('« ' + o.n +' » acheté et équipé', 'win');
    burstAt(innerWidth / 2, 200, 30);
    renderApp(); go('boutique/' + cat); route();
  });
  $$('[data-eq]').forEach(b => b.onclick = () => {
    S.shop.eq[cat] = b.dataset.eq; commit(); applySkin();
    toast('Équipé'); renderApp(); go('boutique/' + cat); route();
  });
};

/* ============================================================
   SUCCES
   ============================================================ */
VIEWS.succes = function (host) {
  const obtenus = SUCCES.filter(a => S.succes[a.id]);
  const gagne = obtenus.reduce((a, b) => a + b.r, 0);
  host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Succès</div>' +
    '<h1>Succès</h1><p>' + obtenus.length + ' succès sur ' + SUCCES.length + ' — ' + nfmt(gagne) + ' δ gagnés grâce à eux.</p>' +
    '<div class="bar" style="margin-top:10px;max-width:340px"><i style="width:' + Math.round(100 * obtenus.length / SUCCES.length) + '%"></i></div></div></div>' +
    '<div class="grid g2">' + SUCCES.map(a => {
      const on = !!S.succes[a.id];
      return '<div class="badge' + (on ? '' : ' off') + '">' +
        '<i style="font-size:22px;color:' + (on ? 'var(--coin)' : 'var(--faint)') + '">' + a.i + '</i>' +
        '<span style="flex:1"><b>' + esc(a.n) + '</b><span>' + esc(a.d) + '</span></span>' +
        '<span class="pill ' + (on ? 't-ok' : 't-neutral') + '">' + (on ? '✓ ' : '') + a.r + ' δ</span></div>';
    }).join('') + '</div>';
};

</script>
<script>
/* Delta — demarrage. */
(function boot() {
  dbLoad();
  if (DB.theme) document.documentElement.setAttribute('data-theme', DB.theme);
  if (DB.last && DB.users[DB.last]) { login(DB.last); touchStreak(); }
  addEventListener('hashchange', route);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    applySkin();
    const b = $('#themebtn'); if (b) b.textContent = effTheme() === 'dark' ? '☾' : '☀';
  });
  renderApp();
  if (USER) checkSucces();
})();

</script>
