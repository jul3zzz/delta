<title>Delta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Delta — histoire, geographie, EMC — 3e / brevet
   Identite : atlas de poche + carnet d'explorateur.
   Fraunces = titres & chrome (serif un peu bancale, tres "vieille carte"),
   Literata = lecture longue, IBM Plex Mono = dates, chiffres, legendes.
   ============================================================ */
:root{
  --paper:#EFE8DA; --paper2:#E6DDCB; --surface:#FCFAF5; --surface2:#F4EFE3;
  --line:#D6C9B0; --line2:#E9E1D0;
  --ink:#221D16; --ink2:#3E3529; --muted:#6E6252; --faint:#968975;
  --brand:#2C5F8A; --brand-ink:#1E466A; --brand-soft:#DEE9F2;
  --hist:#9A3B2E; --hist-soft:#F6E3DD;
  --geo:#1C7A5E; --geo-soft:#DCEFE7;
  --emc:#6E4A9E; --emc-soft:#EAE1F6;
  --ok:#1F6B45; --ok-soft:#DDEEE3;
  --bad:#AC2F2F; --bad-soft:#F8E1DF;
  --warn:#8B6408; --warn-soft:#F8EED3;
  --coin:#976F10; --coin-soft:#F7EED5;
  --grid:rgba(120,92,50,.055); --grid2:rgba(120,92,50,.10);
  --shadow:0 1px 2px rgba(60,44,22,.07), 0 8px 24px -14px rgba(60,44,22,.30);
  --shadow-lift:0 2px 4px rgba(60,44,22,.10), 0 18px 40px -18px rgba(60,44,22,.44);
  --r:10px; --r-s:6px; --r-l:16px;
  --ff-d:"Fraunces",Georgia,serif;
  --ff-b:"Literata",Georgia,serif;
  --ff-m:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --rail:250px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#100D0A; --paper2:#171310; --surface:#1D1913; --surface2:#25201A;
  --line:#3A3227; --line2:#2B251E;
  --ink:#F0E9DC; --ink2:#D5CBBA; --muted:#A2947F; --faint:#7C7061;
  --brand:#79B4DE; --brand-ink:#9CCBEF; --brand-soft:#152A3A;
  --hist:#E58270; --hist-soft:#361A15;
  --geo:#55C39C; --geo-soft:#0F3227;
  --emc:#B694ED; --emc-soft:#241A38;
  --ok:#5FC08C; --ok-soft:#12301F;
  --bad:#EE8177; --bad-soft:#37191A;
  --warn:#DFB55F; --warn-soft:#312608;
  --coin:#E4C169; --coin-soft:#2F2609;
  --grid:rgba(220,190,140,.045); --grid2:rgba(220,190,140,.085);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.85);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 22px 48px -20px rgba(0,0,0,.92);
  color-scheme:dark;
} }
:root[data-theme="dark"]{
  --paper:#100D0A; --paper2:#171310; --surface:#1D1913; --surface2:#25201A;
  --line:#3A3227; --line2:#2B251E;
  --ink:#F0E9DC; --ink2:#D5CBBA; --muted:#A2947F; --faint:#7C7061;
  --brand:#79B4DE; --brand-ink:#9CCBEF; --brand-soft:#152A3A;
  --hist:#E58270; --hist-soft:#361A15;
  --geo:#55C39C; --geo-soft:#0F3227;
  --emc:#B694ED; --emc-soft:#241A38;
  --ok:#5FC08C; --ok-soft:#12301F;
  --bad:#EE8177; --bad-soft:#37191A;
  --warn:#DFB55F; --warn-soft:#312608;
  --coin:#E4C169; --coin-soft:#2F2609;
  --grid:rgba(220,190,140,.045); --grid2:rgba(220,190,140,.085);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.85);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 22px 48px -20px rgba(0,0,0,.92);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ff-d); font-size:15px; line-height:1.55;
  font-variant-numeric:tabular-nums;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:22px 22px,22px 22px,110px 110px,110px 110px;
}
h1,h2,h3,h4{font-family:var(--ff-d);font-weight:700;line-height:1.15;text-wrap:balance;margin:0;font-variation-settings:"SOFT" 20,"WONK" 1}
h1{font-size:clamp(26px,3.4vw,40px);letter-spacing:-.015em;font-variation-settings:"opsz" 96,"SOFT" 24,"WONK" 1}
h2{font-size:clamp(20px,2.2vw,26px);letter-spacing:-.01em;font-variation-settings:"opsz" 48,"SOFT" 20,"WONK" 1}
h3{font-size:17px}
p{margin:0}
a{color:var(--brand);text-decoration-thickness:1px;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--ff-m)}
.eyebrow{font-family:var(--ff-m);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.hide{display:none!important}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- coquille ---------- */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:16px 12px 20px;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;text-decoration:none;color:inherit}
.delta,.brand .delta{
  width:40px;height:40px;flex:none;display:grid;place-items:center;
  border-radius:11px;background:var(--ink);color:var(--paper);
  font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:25px;line-height:1;
  letter-spacing:0;text-transform:none;color:var(--paper);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.brand b{font-size:20px;letter-spacing:-.01em;display:block;font-variation-settings:"SOFT" 30,"WONK" 1}
.brand span{display:block;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.navsec{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);padding:14px 10px 5px}
.nav{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);
  text-decoration:none;color:var(--ink2);font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;background:none;width:100%;text-align:left;
}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand-ink);border-color:color-mix(in srgb,var(--brand) 25%,transparent);font-weight:600}
.nav i{width:18px;text-align:center;font-style:normal;font-size:15px;opacity:.85}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:10px 22px;background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:26px 22px 90px}
.wrap.narrow{max-width:800px}

/* ---------- jetons d'etat ---------- */
.stat{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-family:var(--ff-m);font-size:12.5px;font-weight:500}
.stat b{font-weight:600}
.stat.coin{color:var(--coin);background:var(--coin-soft);border-color:color-mix(in srgb,var(--coin) 30%,transparent)}
.stat.elo{color:var(--brand-ink);background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-family:var(--ff-m);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid}
.t-hist{color:var(--hist);background:var(--hist-soft);border-color:color-mix(in srgb,var(--hist) 28%,transparent)}
.t-geo{color:var(--geo);background:var(--geo-soft);border-color:color-mix(in srgb,var(--geo) 28%,transparent)}
.t-emc{color:var(--emc);background:var(--emc-soft);border-color:color-mix(in srgb,var(--emc) 28%,transparent)}
.t-neutral{color:var(--muted);background:var(--surface2);border-color:var(--line)}
.t-ok{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.t-bad{color:var(--bad);background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}

/* ---------- boutons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;transition:transform .08s ease,background .15s,border-color .15s,box-shadow .15s;
}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12)}
:root[data-theme="dark"] .btn.p,:root:not([data-theme="light"]) .btn.p{color:#100D0A}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.p{color:#fff}}
.btn.p:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.big{padding:13px 24px;font-size:16px;border-radius:var(--r)}
.btn.wide{width:100%}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flush{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.hr{height:1px;background:var(--line2);border:0;margin:0}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.pagehead .grow{min-width:240px}
.pagehead p{color:var(--muted);font-family:var(--ff-b);font-size:15.5px;max-width:64ch;margin-top:6px}

/* fiche de chapitre dans les listes */
.chap{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}
.chap:hover{border-color:var(--faint);box-shadow:var(--shadow)}
.chap .num{font-family:var(--ff-m);font-size:11px;font-weight:600;color:var(--faint);padding-top:3px;min-width:34px}
.chap h3{font-size:15.5px;margin-bottom:2px}
.chap p{font-size:13px;color:var(--muted);font-family:var(--ff-b)}
.chap .done{color:var(--ok);font-size:15px;margin-left:auto}
.chap.is-done{background:linear-gradient(90deg,var(--ok-soft),transparent 45%)}

/* barre de progression */
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s ease}
.bar.hist>i{background:var(--hist)} .bar.geo>i{background:var(--geo)} .bar.emc>i{background:var(--emc)}
.barlab{display:flex;justify-content:space-between;font-family:var(--ff-m);font-size:11px;color:var(--muted);margin-bottom:5px}

/* ---------- lecon ---------- */
.lesson{font-family:var(--ff-b);font-size:16.5px;line-height:1.7;color:var(--ink2)}
.lesson h2{font-family:var(--ff-d);color:var(--ink);margin:30px 0 10px;font-size:20px;display:flex;gap:10px;align-items:baseline}
.lesson h2::before{content:"";width:16px;height:2px;background:var(--acc,var(--brand));display:inline-block;transform:translateY(-5px);flex:none}
.lesson p+p{margin-top:12px}
.lesson strong{color:var(--ink);font-weight:600}
.lesson em{color:var(--ink);font-style:italic}
.lesson ul{margin:12px 0;padding-left:20px}
.lesson li{margin:5px 0}
.lesson .defs{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;margin:14px 0}
.lesson .defs div{background:var(--surface);padding:9px 13px;font-size:15px}
.lesson .defs b{font-family:var(--ff-d);font-weight:700;color:var(--ink)}
.lesson code{font-family:var(--ff-m);font-size:.9em;background:var(--surface2);border:1px solid var(--line2);padding:1px 5px;border-radius:4px}

/* l'anecdote : la signature de Delta */
.anec{
  margin:18px 0;padding:14px 16px 14px 46px;border-radius:var(--r-s);position:relative;
  background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--coin);
  font-family:var(--ff-b);font-size:15.5px;line-height:1.62;color:var(--ink2);
}
.anec::before{
  content:"✶";position:absolute;left:15px;top:12px;font-size:17px;color:var(--coin);line-height:1;
}
.anec b{font-family:var(--ff-d);color:var(--coin);font-size:11px;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:5px;font-weight:700}
.callout{margin:16px 0;padding:13px 15px;border-radius:var(--r-s);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:15px;color:var(--ink2);font-family:var(--ff-b)}
.callout b{font-family:var(--ff-d);color:var(--warn);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px}
.keep{margin:18px 0;padding:14px 16px;border-radius:var(--r-s);background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 28%,transparent);font-family:var(--ff-b);font-size:15.5px;color:var(--ink2)}
.keep b{font-family:var(--ff-d);color:var(--ok);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:5px}
.keep ul{margin:6px 0 0;padding-left:20px}

/* document source */
.docsrc{
  margin:18px 0;padding:15px 17px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surface2);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,var(--line2) 27px,var(--line2) 28px);
  font-family:var(--ff-b);font-size:15.5px;line-height:28px;color:var(--ink2);
}
.docsrc .dt{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;line-height:1.4}
.docsrc .src{font-family:var(--ff-m);font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5;text-align:right}
.docsrc blockquote{margin:0;font-style:italic}

/* chiffres cles */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;margin:18px 0}
.figs div{background:var(--surface);padding:12px 14px;text-align:center}
.figs b{display:block;font-family:var(--ff-m);font-size:22px;font-weight:600;color:var(--acc,var(--brand));line-height:1.15}
.figs span{font-family:var(--ff-b);font-size:12.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.35}

/* tableau */
.tab{width:100%;border-collapse:collapse;margin:18px 0;font-size:14.5px;font-family:var(--ff-b)}
.tab th,.tab td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
.tab th{background:var(--surface2);font-family:var(--ff-d);font-weight:700;font-size:13.5px}
.tab caption{caption-side:bottom;font-family:var(--ff-m);font-size:11px;color:var(--muted);padding-top:7px}

/* figure / carte */
.figure{
  margin:20px 0;padding:14px 12px 12px;border:1px solid var(--line);border-radius:var(--r-s);overflow-x:auto;
  background-color:var(--surface2);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;
}
.figbox{margin:0 auto;width:100%}
.figure svg{display:block;width:100%;max-width:100%;height:auto}
.figure figcaption{
  font-family:var(--ff-m);font-size:12px;color:var(--muted);text-align:center;margin-top:10px;
  padding-top:8px;border-top:1px solid var(--line2);letter-spacing:.01em;
}
.lessnav{display:flex;gap:10px;align-items:center;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}
.toc{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.toc a{display:block;padding:5px 10px;font-size:13px;color:var(--muted);text-decoration:none;border-left:2px solid var(--line2)}
.toc a:hover{color:var(--ink);border-left-color:var(--brand)}

/* reperes du chapitre */
.rep{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;margin:16px 0}
.rep div{background:var(--surface);padding:8px 13px;display:flex;gap:14px;align-items:baseline;font-family:var(--ff-b);font-size:14.5px}
.rep b{font-family:var(--ff-m);font-weight:600;color:var(--acc,var(--brand));min-width:92px;flex:none;font-size:13px}

/* ---------- exercices ---------- */
.exo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.exo .q{font-family:var(--ff-b);font-size:16px;line-height:1.55;color:var(--ink)}
.exo .q code,.q code{font-family:var(--ff-m);font-size:.92em;background:var(--surface2);border:1px solid var(--line2);padding:1px 5px;border-radius:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);cursor:pointer;text-align:left;font-size:14.5px;font-family:var(--ff-b);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--faint);background:var(--surface2)}
.opt .mk{font-family:var(--ff-m);font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:4px;width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:1px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.good .mk{color:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .mk{color:var(--bad);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.numin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.numin input,.txtin{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface2);font-family:var(--ff-m);font-size:15px;min-width:130px}
.txtin{width:100%}
.fb{padding:11px 14px;border-radius:var(--r-s);font-size:14.5px;font-family:var(--ff-b);display:flex;gap:9px;align-items:flex-start;animation:pop .28s ease}
.fb.ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.fb.no{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.fb b{font-family:var(--ff-d)}
.fb .why{color:var(--ink2);display:block;margin-top:3px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.streak{font-family:var(--ff-m);font-size:12px;color:var(--coin)}
.gain{position:fixed;pointer-events:none;font-family:var(--ff-m);font-weight:600;font-size:15px;color:var(--coin);z-index:900;animation:rise 1s ease forwards}
@keyframes rise{to{transform:translateY(-42px);opacity:0}}

/* ---------- fiches de collection ---------- */
.rar-tra{--rc:#7A6A56;--rc2:#A2907A}
.rar-tem{--rc:#12796B;--rc2:#3FB3A4}
.rar-arc{--rc:#2F5CB8;--rc2:#6E8FE4}
.rar-mon{--rc:#A9761A;--rc2:#DDA945}
.rar-leg{--rc:#9E2B7E;--rc2:#DC63B9}
.rar-del{--rc:#C2410C;--rc2:#0EA5A5}
.fiche{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;
  transition:transform .16s ease,box-shadow .16s ease;
}
.fiche:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.fiche::before{content:"";position:absolute;inset:0;border-radius:12px;border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);pointer-events:none}
.fiche .band{display:flex;align-items:center;gap:6px;padding:6px 10px;background:color-mix(in srgb,var(--rc) 12%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--rc) 30%,transparent)}
.fiche .code{font-family:var(--ff-m);font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--rc)}
.fiche .rname{margin-left:auto;font-family:var(--ff-m);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--rc);font-weight:600}
.fiche .plate{
  position:relative;aspect-ratio:4/3;background:var(--surface2);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:12px 12px;display:grid;place-items:center;overflow:hidden;
}
.fiche .plate svg{width:100%;height:100%;display:block}
.fiche .foot{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
.fiche .foot h4{font-family:var(--ff-d);font-size:13.5px;font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.fiche .foot .sub{font-family:var(--ff-m);font-size:10px;color:var(--muted);margin-top:auto}
.fiche .dup{position:absolute;top:32px;right:8px;z-index:2;font-family:var(--ff-m);font-size:10px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 7px}
.fiche.locked{cursor:default}
.fiche.locked .plate svg{opacity:.10;filter:grayscale(1)}
.fiche.locked .foot h4{color:var(--faint)}
.fiche.locked::before{border-style:dashed;border-color:var(--line)}
.fiche.locked:hover{transform:none;box-shadow:var(--shadow)}
.rar-del .band{background:linear-gradient(90deg,color-mix(in srgb,#C2410C 16%,var(--surface)),color-mix(in srgb,#CA8A04 16%,var(--surface)),color-mix(in srgb,#0EA5A5 16%,var(--surface)))}

/* animation d'ouverture */
.stage{display:grid;place-items:center;min-height:420px;position:relative;overflow:hidden;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);
  background-image:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc,var(--brand)) 12%,transparent),transparent 62%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,22px 22px,22px 22px;}
.orb{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6,transparent 60%),var(--rc,var(--brand));box-shadow:0 0 0 0 color-mix(in srgb,var(--rc,var(--brand)) 50%,transparent);animation:charge 1.05s cubic-bezier(.5,0,.4,1) forwards}
@keyframes charge{0%{transform:scale(.2);opacity:0}35%{transform:scale(1);opacity:1}75%{transform:scale(.86);box-shadow:0 0 0 26px color-mix(in srgb,var(--rc,var(--brand)) 0%,transparent)}100%{transform:scale(3.4);opacity:0}}
.flare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff,transparent 45%);opacity:0;animation:flare .5s ease .85s forwards}
@keyframes flare{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.reveal{width:min(300px,80vw);animation:land .6s cubic-bezier(.16,1,.3,1) both}
@keyframes land{from{transform:translateY(-28px) rotateX(58deg) scale(.86);opacity:0}to{transform:none;opacity:1}}
.rays{position:absolute;width:640px;height:640px;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 6deg,color-mix(in srgb,var(--rc) 30%,transparent) 6deg 9deg,transparent 9deg 18deg);animation:spin 14s linear infinite;opacity:.5;mask-image:radial-gradient(circle,#000 20%,transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* fiche detaillee */
.sheet{display:grid;grid-template-columns:300px 1fr;gap:22px}
.sheet .desc{font-family:var(--ff-b);font-size:16px;line-height:1.68;color:var(--ink2)}
.sheet .desc p+p{margin-top:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:14px 0}
.kv dt{font-family:var(--ff-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.kv dd{margin:0;color:var(--ink)}

/* ---------- boutique / profil ---------- */
.shopitem{display:flex;flex-direction:column;gap:9px;padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:center}
.shopitem .prev{height:74px;border-radius:var(--r-s);border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden;background:var(--surface2)}
.shopitem h4{font-size:13.5px;font-family:var(--ff-d)}
.shopitem .price{font-family:var(--ff-m);font-size:12.5px;color:var(--coin);font-weight:600}
.avaG{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line)}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:20px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.pcard .bg{position:absolute;inset:0;opacity:.92}
.pcard>*{position:relative}
.ava{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tiles div{background:var(--surface);padding:12px 14px}
.tiles b{display:block;font-family:var(--ff-m);font-size:21px;font-weight:600;color:var(--ink);line-height:1.1}
.tiles span{font-family:var(--ff-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface)}
.badge.off{opacity:.45}
.badge i{font-style:normal;font-size:20px}
.badge b{display:block;font-size:13.5px}
.badge span{font-size:12px;color:var(--muted);font-family:var(--ff-b)}

/* ---------- onglets & filtres ---------- */
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow-x:auto}
.tabs button{padding:6px 15px;border-radius:99px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;font-family:var(--ff-d)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:hover:not(.on){color:var(--ink)}

/* ---------- brevet ---------- */
.exam{display:grid;grid-template-columns:1fr 268px;gap:22px;align-items:start}
.qbloc{padding:16px 0;border-top:1px solid var(--line2)}
.qnum{font-family:var(--ff-m);font-size:11px;font-weight:600;color:var(--brand);letter-spacing:.06em}
.pts{font-family:var(--ff-m);font-size:11px;color:var(--faint);float:right}
.timer{font-family:var(--ff-m);font-size:27px;font-weight:600;letter-spacing:.02em;line-height:1}
.timer.warn{color:var(--warn)} .timer.crit{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.score{font-family:var(--ff-m);font-size:44px;font-weight:600;line-height:1}
.modelans{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 28%,transparent);border-radius:var(--r-s);padding:11px 13px;font-family:var(--ff-b);font-size:14.5px;color:var(--ink2);margin-top:9px}
.modelans ul{margin:6px 0 0;padding-left:19px}
.selfeval{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- mini-jeux ---------- */
.gamehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:16px}
.gamehead .hp{display:flex;gap:4px}
.gamehead .hp i{width:11px;height:11px;border-radius:50%;background:var(--bad);font-style:normal}
.gamehead .hp i.off{background:var(--line2)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px}
.slotrow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.slot{padding:9px 14px;border:1px dashed var(--line);border-radius:var(--r-s);min-width:120px;text-align:center;font-size:13.5px;background:var(--surface2)}
.chipbtn{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:600;font-family:var(--ff-d)}
.chipbtn:hover{border-color:var(--brand);color:var(--brand)}
.chipbtn.used{opacity:.3;pointer-events:none}
/* frise jouable */
.friserow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:center;margin:16px 0}
.frisecard{padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:13.5px;font-family:var(--ff-b);max-width:190px;cursor:grab;transition:border-color .12s,transform .1s}
.frisecard:hover{border-color:var(--brand)}
.frisecard.on{border-color:var(--brand);background:var(--brand-soft);transform:translateY(-2px)}
.frisecard.good{border-color:var(--ok);background:var(--ok-soft)}
.frisecard.wrong{border-color:var(--bad);background:var(--bad-soft)}
.frisecard .yr{font-family:var(--ff-m);font-size:11px;color:var(--muted);display:block}
/* carte jouable */
.mapgame{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.mapgame svg{display:block;width:100%;height:auto}
.mapgame .zone{cursor:pointer;transition:fill .15s}
.mapgame .zone:hover{fill:color-mix(in srgb,var(--brand) 35%,transparent)}
.mapgame .zone.good{fill:color-mix(in srgb,var(--ok) 55%,transparent)}
.mapgame .zone.wrong{fill:color-mix(in srgb,var(--bad) 55%,transparent)}
/* curseur de date */
.slid{width:100%;margin:18px 0 6px}
.slid input{width:100%}
.axis{display:flex;justify-content:space-between;font-family:var(--ff-m);font-size:11px;color:var(--muted)}
.bigyear{font-family:var(--ff-m);font-size:38px;font-weight:600;text-align:center;color:var(--brand)}

/* ---------- modale, toast, auth ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:18px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-lift);width:min(760px,100%);max-height:88vh;overflow:auto;padding:22px;animation:up .22s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(14px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal .x{position:sticky;top:0;float:right;margin:-6px -6px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lift);animation:up .2s ease}
.toast.win{background:var(--ok);color:#fff}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.authbox{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:26px;box-shadow:var(--shadow-lift)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface2);font-size:15px}
.err{color:var(--bad);font-size:13px;font-family:var(--ff-b)}

/* ---------- responsive ---------- */
@media(max-width:1080px){ .sheet{grid-template-columns:1fr} .exam{grid-template-columns:1fr} }
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:272px;z-index:60;transform:translateX(-100%);transition:transform .22s ease;height:100dvh}
  .rail.open{transform:none;box-shadow:var(--shadow-lift)}
  .railscrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .wrap{padding:18px 15px 80px}
  .topbar{padding:9px 14px;gap:8px}
  .g4{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media(min-width:861px){ #burger{display:none} .railscrim{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

<div id="app"></div>

<div id="modalhost"></div>

<script>
/* ============================================================
   Delta — noyau : stockage, comptes, economie, Elo, routeur.
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = c[i]; c[i] = c[j]; c[j] = t; } return c; };
const today = () => new Date().toISOString().slice(0, 10);
const nfmt = n => Number(n).toLocaleString('fr-FR');
const norm = s => String(s || '')
  .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’ʼ]/g, "'").replace(/[‐-―]/g, '-')
  .replace(/[.,;:!?()"]/g, ' ').replace(/\s+/g, ' ').trim();

const MAT = {
  hist: { n: 'Histoire', c: 'var(--hist)', cls: 't-hist', ic: '◆' },
  geo: { n: 'Géographie', c: 'var(--geo)', cls: 't-geo', ic: '◉' },
  emc: { n: 'EMC', c: 'var(--emc)', cls: 't-emc', ic: '⚖' }
};

/* ---------- stockage ---------- */
const KEY = 'delta_save_v1';
let DB = { v: 1, users: {}, last: null, theme: null };
function dbLoad() {
  try { const r = localStorage.getItem(KEY); if (r) DB = Object.assign(DB, JSON.parse(r)); } catch (e) { }
}
function dbSave() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { } }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

function blankSave() {
  return {
    coins: 250, xp: 0, elo: 800, eloPeak: 800, rolls: 0, pity: 0, pityDel: 0,
    streak: { n: 0, last: '', best: 0 },
    cours: {}, exos: {}, cards: {}, succes: {}, games: {}, brevets: [], reperes: {},
    bio: '', shop: {
      owned: ['th-atlas', 'av-boussole', 'ba-graticule', 'ca-simple', 'ti-debut', 'do-quadrille'],
      eq: { theme: 'th-atlas', avatar: 'av-boussole', banner: 'ba-graticule', frame: 'ca-simple', title: 'ti-debut', back: 'do-quadrille' }
    },
    stats: { exoOk: 0, exoTot: 0, lecons: 0, jeux: 0, brevet: 0 },
    created: Date.now()
  };
}
let USER = null;               // pseudo courant
let S = null;                  // raccourci vers DB.users[USER].save
function commit() { dbSave(); }

function login(pseudo) { USER = pseudo; S = DB.users[pseudo].save; DB.last = pseudo; migrate(S); commit(); }
function migrate(s) {
  const b = blankSave();
  for (const k in b) if (!(k in s)) s[k] = b[k];
  for (const k in b.shop.eq) if (!(k in s.shop.eq)) s.shop.eq[k] = b.shop.eq[k];
  for (const k in b.stats) if (!(k in s.stats)) s.stats[k] = b.stats[k];
}
function logout() { USER = null; S = null; DB.last = null; commit(); location.hash = ''; renderApp(); }

/* ---------- economie, XP, niveaux ---------- */
const LVL = n => Math.floor(40 * Math.pow(n, 1.55));          // XP cumule requis pour le niveau n
function levelOf(xp) { let n = 1; while (xp >= LVL(n + 1)) n++; return n; }
function levelInfo() {
  const n = levelOf(S.xp), a = LVL(n), b = LVL(n + 1);
  return { n: n, a: a, b: b, pct: Math.round(100 * (S.xp - a) / (b - a)) };
}
function gain(coins, xp, ev) {
  const before = levelOf(S.xp);
  if (coins) S.coins += coins;
  if (xp) S.xp += xp;
  commit();
  if (ev) floatGain(ev, (coins ? '+' + coins + ' δ' : '') + (coins && xp ? '  ' : '') + (xp ? '+' + xp + ' XP' : ''));
  const after = levelOf(S.xp);
  if (after > before) { toast('Niveau ' + after + ' atteint', 'win'); burstAt(innerWidth / 2, 120, 60); }
  paintBar();
}
function spend(n) { if (S.coins < n) { toast('Il te manque ' + (n - S.coins) + ' δ'); return false; } S.coins -= n; commit(); paintBar(); return true; }

/* ---------- Elo ---------- */
const RANGS = [
  { e: 0, n: 'Curieux d’archives', g: 'ι' },
  { e: 900, n: 'Archiviste', g: 'κ' },
  { e: 1020, n: 'Cartographe', g: 'λ' },
  { e: 1140, n: 'Chroniqueur', g: 'μ' },
  { e: 1260, n: 'Historien', g: 'ν' },
  { e: 1380, n: 'Géographe confirmé', g: 'ξ' },
  { e: 1500, n: 'Conservateur', g: 'π' },
  { e: 1650, n: 'Lauréat Delta', g: 'Δ' }
];
function rang(e) { let r = RANGS[0]; for (let i = 0; i < RANGS.length; i++) if (e >= RANGS[i].e) r = RANGS[i]; return r; }
function rangNext(e) { for (let i = 0; i < RANGS.length; i++) if (e < RANGS[i].e) return RANGS[i]; return null; }
function elo(diff, win, k) {
  const R = S.elo, D = 700 + diff * 190;                       // difficulte 0..5 -> 700..1650
  const exp = 1 / (1 + Math.pow(10, (D - R) / 400));
  const d = Math.round((k || 22) * ((win ? 1 : 0) - exp));
  S.elo = Math.max(100, R + d);
  if (S.elo > S.eloPeak) S.eloPeak = S.elo;
  commit(); paintBar();
  return d;
}
function eloTag(d) {
  return '<span class="pill ' + (d >= 0 ? 't-ok' : 't-bad') + '">' + (d >= 0 ? '+' : '') + d + ' Elo</span>';
}

/* ---------- serie quotidienne ---------- */
function touchStreak() {
  const t = today(); if (S.streak.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak.n = (S.streak.last === y) ? S.streak.n + 1 : 1;
  S.streak.last = t; S.streak.best = Math.max(S.streak.best || 0, S.streak.n);
  const bonus = 20 + Math.min(S.streak.n, 10) * 10;
  S.coins += bonus; commit();
  setTimeout(() => toast('Jour ' + S.streak.n + ' d’affilée : +' + bonus + ' δ', 'win'), 500);
}

/* ---------- retours visuels ---------- */
function toast(msg, cls) {
  const h = $('#toast'); if (!h) return;
  const d = document.createElement('div'); d.className = 'toast' + (cls ? ' ' + cls : ''); d.textContent = msg;
  h.appendChild(d);
  setTimeout(() => { d.style.transition = 'opacity .3s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 320); }, 2300);
}
function floatGain(ev, txt) {
  if (!txt) return;
  const node = (ev && (ev.currentTarget || ev.target)) || document.body;
  const r = node.getBoundingClientRect ? node.getBoundingClientRect() : { left: innerWidth / 2, top: 120, width: 0 };
  const d = document.createElement('div'); d.className = 'gain'; d.textContent = txt;
  d.style.left = (r.left + r.width / 2 - 30) + 'px'; d.style.top = (r.top - 6) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function burstAt(x, y, n, colors) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:950';
  cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv);
  const g = cv.getContext('2d'), C = colors || ['#2C5F8A', '#9A3B2E', '#1C7A5E', '#976F10', '#6E4A9E'];
  const P = [];
  for (let i = 0; i < (n || 40); i++) P.push({ x: x, y: y, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 2, r: 2 + Math.random() * 3, c: pick(C), a: 1 });
  let t = 0;
  (function loop() {
    t++; g.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += .32; p.a -= .016; g.globalAlpha = Math.max(0, p.a); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
    if (t < 70) requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ---------- modale ---------- */
function modal(inner, after) {
  const host = $('#modalhost');
  host.innerHTML = '<div class="scrim" data-close><div class="modal" role="dialog" aria-modal="true">' +
    '<button class="btn ghost sm x" data-close aria-label="Fermer">✕</button>' + inner + '</div></div>';
  host.querySelector('.scrim').addEventListener('click', e => { if (e.target.hasAttribute('data-close')) closeModal(); });
  $$('[data-close]', host).forEach(b => b.addEventListener('click', closeModal));
  document.addEventListener('keydown', escClose);
  if (after) after(host);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() { $('#modalhost').innerHTML = ''; document.removeEventListener('keydown', escClose); }

/* ---------- routeur ---------- */
const VIEWS = {};
let CUR = '';
function go(p) { location.hash = '#/' + p; }
function route() {
  if (!USER) { renderApp(); return; }
  const h = (location.hash || '#/accueil').replace(/^#\//, '') || 'accueil';
  CUR = h;
  const parts = h.split('/');
  const fn = VIEWS[parts[0]] || VIEWS.accueil;
  const host = $('#view');
  if (!host) { renderApp(); return; }
  host.innerHTML = '';
  try { fn(host, parts.slice(1)); }
  catch (err) { host.innerHTML = '<div class="panel"><b>Erreur d’affichage</b><p class="small muted">' + esc(err.message) + '</p></div>'; console.error(err); }
  paintNav(); scrollTo(0, 0);
  $$('.rail').forEach(r => r.classList.remove('open'));
  $$('.railscrim').forEach(r => r.remove());
}

/* ---------- theme clair / sombre ---------- */
function effTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function setTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  DB.theme = t || null; commit(); applySkin();
  const b = $('#themebtn'); if (b) b.textContent = effTheme() === 'dark' ? '☾' : '☀';
}
function applySkin() {
  const st = document.documentElement.style;
  ['--brand', '--brand-ink', '--brand-soft', '--paper', '--paper2', '--surface', '--surface2', '--ink', '--ink2', '--muted', '--line', '--line2', '--grid', '--grid2', '--faint'].forEach(k => st.removeProperty(k));
  if (!S || typeof SHOP === 'undefined') return;
  const th = SHOP.theme.find(x => x.id === S.shop.eq.theme);
  if (!th || !th.vars) return;
  const v = th.vars[effTheme()];
  if (v) for (const k in v) st.setProperty(k, v[k]);
}

/* ---------- ecran de compte ---------- */
function authScreen() {
  const names = Object.keys(DB.users);
  return '<div class="auth"><div class="authbox">' +

function wireAuth() {
  let mode = 'in';
  const err = m => { const e = $('#au-err'); e.textContent = m; e.hidden = !m; };
  $('#tb-in').onclick = () => { mode = 'in'; $('#tb-in').classList.add('on'); $('#tb-up').classList.remove('on'); $('#cf').hidden = true; $('#au-go').textContent = 'Ouvrir l’atlas'; err(''); };
  $('#tb-up').onclick = () => { mode = 'up'; $('#tb-up').classList.add('on'); $('#tb-in').classList.remove('on'); $('#cf').hidden = false; $('#au-go').textContent = 'Créer mon compte'; err(''); };
  $$('[data-quick]').forEach(b => b.onclick = () => { $('#au-p').value = b.dataset.quick; $('#au-w').focus(); });
  $('#authform').onsubmit = e => {
    e.preventDefault();
    const p = $('#au-p').value.trim(), w = $('#au-w').value;
    if (p.length < 2) return err('Choisis un pseudo d’au moins 2 caractères.');
    if (w.length < 4) return err('Le mot de passe doit faire au moins 4 caractères.');
    if (mode === 'up') {
      if (DB.users[p]) return err('Ce pseudo existe déjà sur cet appareil.');
      if ($('#au-c').value !== w) return err('Les deux mots de passe ne sont pas identiques.');
      DB.users[p] = { pw: hash(w), save: blankSave() };
      login(p); touchStreak();
      renderApp(); go('accueil');
      setTimeout(() => { toast('Bienvenue, ' + p + ' — 250 δ pour démarrer', 'win'); burstAt(innerWidth / 2, 160, 70); }, 250);

      const u = DB.users[p];
      if (!u) return err('Aucun compte à ce pseudo. Passe par « Créer un compte ».');
      if (u.pw !== hash(w)) return err('Mot de passe incorrect.');
      login(p); touchStreak(); renderApp(); go('accueil'); route();
    }
  };
}

<script>
/* ============================================================
   Delta — moteur de cartes, croquis, frises et graphiques.
   Une figure = une liste d'operations :
     ['t', x, y, texte, taille, ancre, couleur, graisse]
     ['l', x1,y1,x2,y2, couleur, epaisseur, tirets]
     ['r', x,y,w,h, remplissage, contour, rayon]
     ['c', x,y,r, remplissage, contour]
     ['poly', [[x,y],...], remplissage, contour, epaisseur]
     ['path', d, remplissage, contour, epaisseur]
     ['a', x1,y1,x2,y2, couleur, legende, epaisseur]      fleche droite
     ['ca', x1,y1,x2,y2, courbure, couleur, legende]      fleche courbe (flux)
     ['hatch', [[x,y],...], couleur, angle]               aplat hachure
     ['sym', x,y, genre, couleur, taille]                 figure ponctuelle
     ['key', x,y, [[genre, couleur, texte],...], titre]   legende
     ['map', nom, x,y, echelle, options]                  fond de carte
     ['frise', x,y,w, debut,fin, [[annee,texte,couleur,cote],...], options]
     ['bars', x,y,w,h, [[etiquette,valeur],...], options]
     ['courbe', x,y,w,h, [[x,y],...], options]
     ['box', x,y,w,h, titre, couleur]                     cartouche d'organigramme
     ['rose', x,y,r]                                      rose des vents
   Les couleurs sont des jetons de theme : 'i' encre, 'h' histoire, 'g' geo,
   'e' emc, 'b' marque, 'k' rouge, 'o' vert, 'w' ambre, 'c' or, 'm' gris,
   'f' gris clair, 'S' surface, 'S2' surface secondaire, 'mer' bleu mer.
   Un suffixe ':NN' donne un aplat : 'h:20' = 20 % d'histoire sur la surface.
   ============================================================ */

const PAL = {
  i: 'var(--ink)', i2: 'var(--ink2)', m: 'var(--muted)', f: 'var(--faint)',
  b: 'var(--brand)', bi: 'var(--brand-ink)', h: 'var(--hist)', g: 'var(--geo)', e: 'var(--emc)',
  k: 'var(--bad)', o: 'var(--ok)', w: 'var(--warn)', c: 'var(--coin)',
  S: 'var(--surface)', S2: 'var(--surface2)', l: 'var(--line)', l2: 'var(--line2)',
  mer: 'color-mix(in srgb, #4E8FB8 34%, var(--surface))',
  terre: 'color-mix(in srgb, #8A9A5B 26%, var(--surface))',
  none: 'none'
};
function col(spec) {
  if (spec == null || spec === '') return 'none';
  const s = String(spec);
  if (s.indexOf(':') > 0) {
    const p = s.split(':');
    const base = PAL[p[0]] || p[0];
    return 'color-mix(in srgb, ' + base + ' ' + p[1] + '%, var(--surface))';
  }
  return PAL[s] || s;
}
let FIGN = 0;
const fnum = v => Math.round(v * 100) / 100;
const ptsStr = pts => pts.map(p => fnum(p[0]) + ',' + fnum(p[1])).join(' ');

/* ---------- primitives ---------- */
function opText(o) {
  const [, x, y, txt, sz, anc, c, wt] = o;
  const fill = col(c || 'i');
  const halo = (c === 'S' || c === 'S2') ? '' : 'paint-order:stroke;stroke:var(--surface);stroke-width:3.2px;stroke-linejoin:round;';
  return '<text x="' + fnum(x) + '" y="' + fnum(y) + '" font-size="' + (sz || 9) + '" text-anchor="' + (anc || 'start') +
    '" fill="' + fill + '" style="' + halo + 'font-family:var(--ff-m);font-weight:' + (wt || 400) + '">' + esc(txt) + '</text>';
}
function opLine(o) {
  const [, x1, y1, x2, y2, c, w, d] = o;

    (d ? ' stroke-dasharray="' + d + '"' : '') + '/>';

  const [, x, y, w, h, f, s, r] = o;

    '" rx="' + (r || 0) + '" fill="' + col(f) + '"' + (s ? ' stroke="' + col(s) + '" stroke-width="1"' : '') + '/>';
}
function opCirc(o) {
  const [, x, y, r, f, s] = o;
  return '<circle cx="' + fnum(x) + '" cy="' + fnum(y) + '" r="' + fnum(r) + '" fill="' + col(f) + '"' +
    (s ? ' stroke="' + col(s) + '" stroke-width="1.1"' : '') + '/>';
}
function opPoly(o) {
  const [, pts, f, s, w] = o;
  return '<polygon points="' + ptsStr(pts) + '" fill="' + col(f) + '"' +
    (s ? ' stroke="' + col(s) + '" stroke-width="' + (w || 1) + '" stroke-linejoin="round"' : '') + '/>';
}
function opPath(o) {
  const [, d, f, s, w] = o;
  return '<path d="' + d + '" fill="' + col(f) + '"' +
    (s ? ' stroke="' + col(s) + '" stroke-width="' + (w || 1) + '" stroke-linejoin="round" stroke-linecap="round"' : '') + '/>';
}
function head(x1, y1, x2, y2, c, sz) {
  const a = Math.atan2(y2 - y1, x2 - x1), s = sz || 4.2;
  const p1 = [x2, y2], p2 = [x2 - s * Math.cos(a - .42), y2 - s * Math.sin(a - .42)], p3 = [x2 - s * Math.cos(a + .42), y2 - s * Math.sin(a + .42)];
  return '<polygon points="' + ptsStr([p1, p2, p3]) + '" fill="' + col(c) + '"/>';
}
function opArrow(o) {
  const [, x1, y1, x2, y2, c, lab, w] = o;
  const cc = c || 'i', a = Math.atan2(y2 - y1, x2 - x1), sz = 3.4 + (w || 1.4);
  const ex = x2 - sz * .8 * Math.cos(a), ey = y2 - sz * .8 * Math.sin(a);
  let s = '<line x1="' + fnum(x1) + '" y1="' + fnum(y1) + '" x2="' + fnum(ex) + '" y2="' + fnum(ey) +
    '" stroke="' + col(cc) + '" stroke-width="' + (w || 1.4) + '" stroke-linecap="round"/>' + head(x1, y1, x2, y2, cc, sz);
  if (lab) s += opText(['t', (x1 + x2) / 2, (y1 + y2) / 2 - 3.5, lab, 7.5, 'middle', cc, 600]);
  return s;
}
function opCurve(o) {
  const [, x1, y1, x2, y2, bend, c, lab, w] = o;
  const cc = c || 'i', mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / len * (bend || 12), cy = my + dx / len * (bend || 12);
  const t = .93, qx = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * cx + t * t * x2, qy = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * cy + t * t * y2;
  let s = '<path d="M' + fnum(x1) + ' ' + fnum(y1) + ' Q' + fnum(cx) + ' ' + fnum(cy) + ' ' + fnum(qx) + ' ' + fnum(qy) +
    '" fill="none" stroke="' + col(cc) + '" stroke-width="' + (w || 1.6) + '" stroke-linecap="round"/>' +
    head(qx, qy, x2, y2, cc, 4.6 + (w || 1.6));
  if (lab) s += opText(['t', cx, cy - 3, lab, 7.5, 'middle', cc, 600]);

}
function opHatch(o) {
  const [, pts, c, ang] = o;

function sym(x, y, kind, c, sz) {

      'M' + fnum(x - s * .9) + ' ' + fnum(y + s * .2) + 'q' + fnum(s * .9) + ' ' + fnum(s * 1.1) + ' ' + fnum(s * 1.8) + ' 0" fill="none" stroke="' + cc + '" stroke-width="1.2" stroke-linecap="round"/>';

      'v' + fnum(s * .35) + 'l' + fnum(-s * 1.3) + ' ' + fnum(-s * .2) + 'l' + fnum(-.1 * s) + ' ' + fnum(s * .8) + 'l' + fnum(s * .45) + ' ' + fnum(s * .35) + 'v' + fnum(s * .25) +
      'l' + fnum(-s * .8) + ' ' + fnum(-s * .2) + 'l' + fnum(-s * .8) + ' ' + fnum(s * .2) + 'v' + fnum(-s * .25) + 'l' + fnum(s * .45) + ' ' + fnum(-s * .35) +
      'l' + fnum(-.1 * s) + ' ' + fnum(-s * .8) + 'l' + fnum(-s * 1.3) + ' ' + fnum(s * .2) + 'v' + fnum(-s * .35) + 'l' + fnum(s * .95) + ' ' + fnum(-s * .45) + 'z" fill="' + cc + '"/>';
    case 'usine': return '<path d="M' + fnum(x - s) + ' ' + fnum(y + s * .8) + 'v' + fnum(-s * 1.1) + 'l' + fnum(s * .7) + ' ' + fnum(s * .55) + 'v' + fnum(-s * .55) +
      'l' + fnum(s * .7) + ' ' + fnum(s * .55) + 'v' + fnum(-s * 1.3) + 'h' + fnum(s * .6) + 'v' + fnum(s * 1.85) + 'z" fill="' + cc + '"/>';
    case 'croix': return '<path d="M' + fnum(x - s * .8) + ' ' + fnum(y - s * .8) + 'l' + fnum(s * 1.6) + ' ' + fnum(s * 1.6) + 'M' + fnum(x + s * .8) + ' ' + fnum(y - s * .8) + 'l' + fnum(-s * 1.6) + ' ' + fnum(s * 1.6) + '" stroke="' + cc + '" stroke-width="1.6" stroke-linecap="round"/>';
    case 'bataille': return '<path d="M' + fnum(x - s) + ' ' + fnum(y - s) + 'l' + fnum(s * 2) + ' ' + fnum(s * 2) + 'M' + fnum(x + s) + ' ' + fnum(y - s) + 'l' + fnum(-s * 2) + ' ' + fnum(s * 2) + '" stroke="' + cc + '" stroke-width="2" stroke-linecap="round"/>';

    '" rx="3" fill="var(--surface)" fill-opacity=".93" stroke="' + col('l') + '" stroke-width=".9"/>';
  let cy = y + pad + 8;
  if (titre) { s += opText(['t', x + pad, cy, titre, 8, 'start', 'i', 600]); cy += 12; }
  items.forEach(it => {
    const kind = it[0], c = it[1], lab = it[2];
    if (kind === 'f') s += '<rect x="' + fnum(x + pad) + '" y="' + fnum(cy - 5.5) + '" width="9" height="7" fill="' + col(c) + '" stroke="' + col('l') + '" stroke-width=".7"/>';
    else if (kind === 'h') s += opHatch(['hatch', [[x + pad, cy - 5.5], [x + pad + 9, cy - 5.5], [x + pad + 9, cy + 1.5], [x + pad, cy + 1.5]], c, 45]);
    else if (kind === 'l') s += opLine(['l', x + pad, cy - 2, x + pad + 9, cy - 2, c, 1.8]);
    else if (kind === 'd') s += opLine(['l', x + pad, cy - 2, x + pad + 9, cy - 2, c, 1.6, '3 2']);
    else if (kind === 'a') s += opArrow(['a', x + pad, cy - 2, x + pad + 10, cy - 2, c, '', 1.4]);
    else s += sym(x + pad + 4.5, cy - 2, kind, c, 3.6);
    s += opText(['t', x + pad + 13, cy, lab, 7.6, 'start', 'i2']);
    cy += lh;
  });
  return s;
}

/* ---------- rose des vents & echelle ---------- */
function opRose(o) {
  const [, x, y, r] = o, R = r || 9;
  return '<circle cx="' + fnum(x) + '" cy="' + fnum(y) + '" r="' + R + '" fill="var(--surface)" fill-opacity=".8" stroke="' + col('l') + '" stroke-width=".8"/>' +
    '<polygon points="' + ptsStr([[x, y - R * .95], [x + R * .3, y], [x, y + R * .5], [x - R * .3, y]]) + '" fill="' + col('i') + '"/>' +
    opText(['t', x, y - R - 1.5, 'N', 7.5, 'middle', 'i', 700]);
}

/* ---------- annotations ancrees sur des lieux reels ----------
   Les fonds portent un dictionnaire `pt` de lieux projetes comme la carte.
   On place donc symboles, fleches et bandes par NOM DE LIEU, jamais a l'oeil.
     ['ancre', fond, x, y, echelle, [[lieu, genre, couleur, taille, texte, ancre, dx, dy, tailleTexte], …]]
     ['flux',  fond, x, y, echelle, [[depuis, vers, courbure, couleur, texte, epaisseur], …]]
     ['bande', fond, x, y, echelle, [lieu, …], couleur, epaisseur, texte]
   ------------------------------------------------------------ */
function ancreDe(nom, ox, oy, s) {
  const base = CARTES_BASE[nom] || {}, pt = base.pt || {};
  return function (lieu) {
    if (Array.isArray(lieu)) return [lieu[0], lieu[1]];   // point libre de la figure
    const p = pt[lieu];
    if (!p) { console.warn('ancre inconnue : ' + nom + '/' + lieu); return [ox, oy]; }
    return [ox + p[0] * s, oy + p[1] * s];
  };
}
function opAncre(o) {
  const [, nom, ox, oy, s, items] = o;
  const at = ancreDe(nom, ox, oy, s);
  let out = '';
  (items || []).forEach(it => {
    const lieu = it[0], genre = it[1], c = it[2] || 'i', taille = it[3] || 4;
    const texte = it[4], anc = it[5] || 'start', dx = it[6], dy = it[7], ts = it[8] || 7.5;
    const p = at(lieu);
    if (genre && genre !== 'none') out += sym(p[0], p[1], genre, c, taille);
    if (texte) {
      const ex = dx == null ? (anc === 'start' ? taille + 2 : anc === 'end' ? -(taille + 2) : 0) : dx;
      const ey = dy == null ? (anc === 'middle' ? -(taille + 3) : 2.6) : dy;
      out += opText(['t', p[0] + ex, p[1] + ey, texte, ts, anc, c, 600]);
    }
  });
  return out;
}
function opFlux(o) {
  const [, nom, ox, oy, s, items] = o;
  const at = ancreDe(nom, ox, oy, s);
  return (items || []).map(it => {
    const p = at(it[0]), q = at(it[1]);
    return opCurve(['ca', p[0], p[1], q[0], q[1], it[2] || 0, it[3] || 'k', it[4] || '', it[5] || 1.6]);
  }).join('');
}
/* ['aire', fond, x, y, echelle, [[lieu, rayonX, rayonY, angle], ...], couleur, opacite]
   Une tache ovale posee sur un lieu : massifs, bassins, zones d'influence. */
function opAire(o) {
  const [, nom, ox, oy, s, items, c, opac] = o;
  const at = ancreDe(nom, ox, oy, s);
  return (items || []).map(it => {
    const p = at(it[0]);
    const rx = (it[1] == null ? 8 : it[1]) * s, ry = (it[2] == null ? 5 : it[2]) * s, ang = it[3] || 0;
    return '<ellipse cx="0" cy="0" rx="' + fnum(rx) + '" ry="' + fnum(ry) + '" fill="' + col(c || 'm') +
      '" opacity="' + (opac == null ? .38 : opac) + '" transform="translate(' + fnum(p[0]) + ' ' + fnum(p[1]) +
      ') rotate(' + ang + ')"/>';
  }).join('');
}
function opBande(o) {
  const [, nom, ox, oy, s, lieux, c, ep, texte, opac] = o;
  const at = ancreDe(nom, ox, oy, s);
  const pts = (lieux || []).map(at);
  if (pts.length < 2) return '';
  const d = pts.map((p, i) => (i ? 'L' : 'M') + fnum(p[0]) + ' ' + fnum(p[1])).join(' ');
  let out = '<path d="' + d + '" fill="none" stroke="' + col(c || 'b') + '" stroke-width="' + (ep || 8) +
    '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (opac == null ? .38 : opac) + '"/>';
  if (texte) {
    const m = pts[Math.floor((pts.length - 1) / 2)];
    out += opText(['t', m[0], m[1] - ((ep || 8) / 2 + 3.5), texte, 7.5, 'middle', c || 'b', 700]);
  }
  return out;
}

/* ---------- trace d'un fond de carte ---------- */
function opMap(o) {
  const [, nom, ox, oy, sc, opt] = o;
  const base = CARTES_BASE[nom]; if (!base) return '';
  const O = opt || {}, s = sc || 1;
  const X = v => ox + v * s, Y = v => oy + v * s;
  let out = '';
  if (base.mer && O.mer !== false) out += '<rect x="' + fnum(ox) + '" y="' + fnum(oy) + '" width="' + fnum((base.w || 100) * s) + '" height="' + fnum((base.h || 100) * s) + '" fill="' + col('mer') + '" rx="3"/>';
  (base.extra || []).forEach(e => {
    if (e[0] === 'poly') out += opPoly(['poly', e[1].map(p => [X(p[0]), Y(p[1])]), e[2], e[3], (e[4] || 1)]);
  });
  base.z.forEach(z => {
    const f = (O.fill && (O.fill[z.c] || (z.g && O.fill[z.g]))) || O.base || 'terre';
    z.p.forEach(r => {
      out += opPoly(['poly', r.map(p => [X(p[0]), Y(p[1])]), f, O.trait || 'l', O.tw || 1.05]);
    });
  });
  if (O.hatch) for (const c in O.hatch) {
    base.z.filter(q => q.c === c || q.g === c).forEach(z => {
      z.p.forEach(r => { out += opHatch(['hatch', r.map(p => [X(p[0]), Y(p[1])]), O.hatch[c], 45]); });
    });
  }
  if (O.noms) {
    const only = Array.isArray(O.noms) ? O.noms : null;
    const sz = O.ns || 7;
    base.z.forEach(z => {
      if (only && only.indexOf(z.c) < 0 && only.indexOf(z.g) < 0) return;
      if (!z.lab) return;
      const lignes = String(z.sn || z.n).split('|');
      lignes.forEach((L, i) => {
        out += opText(['t', X(z.lab[0]), Y(z.lab[1]) + (i - (lignes.length - 1) / 2) * (sz * 1.15),
          L, sz, 'middle', O.nc || 'i2', 600]);
      });
    });
  }
  if (O.villes) {
    const only = Array.isArray(O.villes) ? O.villes : null;
    (base.villes || []).forEach(v => {
      if (only && only.indexOf(v[0]) < 0) return;
      out += sym(X(v[1]), Y(v[2]), v[3], O.vc || 'i', (O.vs || 3.4));
      out += opText(['t', X(v[1]) + 4.5, Y(v[2]) + 2.5, v[0], (O.vt || 7), 'start', O.vc || 'i', 500]);
    });
  }
  return out;
}
/* pour les mini-jeux : les contours cliquables d'un fond */
function mapZones(nom, ox, oy, sc) {
  const base = CARTES_BASE[nom]; if (!base) return [];
  const s = sc || 1;
  return base.z.map(z => ({
    c: z.c, n: z.n,
    contours: z.p.map(r => ptsStr(r.map(p => [ox + p[0] * s, oy + p[1] * s]))),
    pts: ptsStr(z.p[0].map(p => [ox + p[0] * s, oy + p[1] * s])),
    lab: z.lab ? [ox + z.lab[0] * s, oy + z.lab[1] * s] : null
  }));
}

/* ============================================================
   FRISE CHRONOLOGIQUE
   ['frise', x, y, w, debut, fin, [[annee, texte, couleur, cote],...], opts]
   cote : 1 = au-dessus (defaut), -1 = en dessous.
   opts : {periodes:[[a,b,texte,couleur]], graduation:n, hauteur:n}
   ============================================================ */
/* Etiquette de frise : on calcule sa position ET l'intervalle qu'elle occupe.
   Pres des bords, l'ancrage bascule pour que le texte reste dans la figure ;
   le calcul des collisions travaille donc sur les intervalles REELS. */
const FRISE_CAR = 4.6;
function friseBoite(X, txt, gauche, droite) {
  const lw = Math.max(20, String(txt).length * FRISE_CAR);
  if (X - lw / 2 < gauche) return { x: gauche, anc: 'start', a: gauche, b: gauche + lw };
  if (X + lw / 2 > droite) return { x: droite, anc: 'end', a: droite - lw, b: droite };
  return { x: X, anc: 'middle', a: X - lw / 2, b: X + lw / 2 };
}
function opFrise(o) {
  const [, x, y, w, a0, a1, evs, opt] = o;
  const O = opt || {}, span = (a1 - a0) || 1;
  const px = an => x + (an - a0) / span * w;
  let out = '';
  (O.periodes || []).forEach((p, i) => {
    const xa = px(p[0]), xb = px(p[1]);
    out += '<rect x="' + fnum(xa) + '" y="' + fnum(y - 7) + '" width="' + fnum(Math.max(1, xb - xa)) + '" height="14" rx="2" fill="' + col((p[3] || 'b') + ':18') + '" stroke="' + col(p[3] || 'b') + '" stroke-width=".8"/>';
    /* le nom de la periode ne doit jamais deborder de sa bande */
    if (p[2]) {
      const ts = Math.min(8, (xb - xa - 4) / (String(p[2]).length * 0.56));
      if (ts >= 5) out += opText(['t', (xa + xb) / 2, y + ts * 0.36, p[2], Math.round(ts * 10) / 10, 'middle', p[3] || 'b', 700]);
    }
  });
  out += opLine(['l', x, y, x + w, y, 'i', 1.6]);
  out += head(x + w - 6, y, x + w + 5, y, 'i', 5);
  const step = O.graduation || Math.ceil(span / 10 / 5) * 5;
  for (let an = Math.ceil(a0 / step) * step; an <= a1; an += step) {
    out += opLine(['l', px(an), y - 3, px(an), y + 3, 'f', .9]);
    out += opText(['t', px(an), y + 12.5, String(an), 7.4, 'middle', 'm']);
  }
  const H = O.hauteur || 24;
  const used = { 1: [], '-1': [] };
  const gauche = 1, droite = x + w + 6;
  (evs || []).forEach(e => {
    const [an, txt, c, cote] = e, side = cote === -1 ? -1 : 1, cc = c || 'h';
    const X = px(an);
    const boite = friseBoite(X, txt, gauche, droite);
    let lvl = 0, arr = used[side];
    while (arr.some(u => u.lvl === lvl && u.a < boite.b + 8 && boite.a < u.b + 8)) lvl++;
    arr.push({ lvl: lvl, a: boite.a, b: boite.b });
    const yTip = y - side * (10 + lvl * H);
    out += opLine(['l', X, y - side * 3, X, yTip, cc, 1]);
    out += '<circle cx="' + fnum(X) + '" cy="' + fnum(y) + '" r="2.4" fill="' + col(cc) + '"/>';
    out += '<circle cx="' + fnum(X) + '" cy="' + fnum(yTip) + '" r="1.6" fill="' + col(cc) + '"/>';
    /* une annee fractionnaire sert a placer le point dans l'annee : on n'affiche que l'annee */
    const lab = Math.floor(an);
    const posA = friseBoite(X, String(lab), gauche, droite);
    out += opText(['t', posA.x, yTip - side * 6.5 + (side === 1 ? 0 : 3.5), lab, 8.4, posA.anc, cc, 700]);
    out += opText(['t', boite.x, yTip - side * 6.5 + (side === 1 ? -9.5 : 13), txt, 8, boite.anc, 'i2', 500]);
  });
  return out;
}

/* ---------- graphiques ---------- */
function opBars(o) {
  const [, x, y, w, h, data, opt] = o;
  const O = opt || {}, max = O.max || Math.max.apply(null, data.map(d => d[1])) * 1.1;
  const n = data.length, bw = w / n * .62, gap = w / n;
  let out = opLine(['l', x, y + h, x + w, y + h, 'i', 1.2]) + opLine(['l', x, y, x, y + h, 'i', 1.2]);
  (O.grille || [0, .25, .5, .75, 1]).forEach(g => {
    const gy = y + h - g * h;
    out += opLine(['l', x, gy, x + w, gy, 'l2', .7, '3 3']);
    if (O.axe !== false) out += opText(['t', x - 3, gy + 2.5, String(Math.round(max * g * 10) / 10), 6.5, 'end', 'f']);
  });
  data.forEach((d, i) => {
    const bh = Math.max(0, d[1] / max * h), bx = x + i * gap + (gap - bw) / 2;
    out += opRect(['r', bx, y + h - bh, bw, bh, (d[2] || O.c || 'b') + ':70', d[2] || O.c || 'b', 1.5]);
    out += opText(['t', bx + bw / 2, y + h - bh - 3, O.fmt ? O.fmt(d[1]) : String(d[1]), 6.8, 'middle', d[2] || O.c || 'b', 600]);
    out += opText(['t', bx + bw / 2, y + h + 9, d[0], 6.8, 'middle', 'm']);
  });
  if (O.titre) out += opText(['t', x + w / 2, y - 5, O.titre, 8, 'middle', 'i', 600]);
  return out;
}
function opCourbe(o) {
  const [, x, y, w, h, series, opt] = o;
  const O = opt || {};
  const xs = [].concat.apply([], series.map(s => s.d.map(p => p[0])));
  const ys = [].concat.apply([], series.map(s => s.d.map(p => p[1])));
  const x0 = O.x0 != null ? O.x0 : Math.min.apply(null, xs), x1 = O.x1 != null ? O.x1 : Math.max.apply(null, xs);
  const y0 = O.y0 != null ? O.y0 : 0, y1 = O.y1 != null ? O.y1 : Math.max.apply(null, ys) * 1.1;
  const PX = v => x + (v - x0) / ((x1 - x0) || 1) * w, PY = v => y + h - (v - y0) / ((y1 - y0) || 1) * h;
  let out = '';
  (O.grille || [0, .25, .5, .75, 1]).forEach(g => {
    const gy = y + h - g * h;
    out += opLine(['l', x, gy, x + w, gy, 'l2', .7, '3 3']);
    out += opText(['t', x - 3, gy + 2.5, String(Math.round((y0 + (y1 - y0) * g) * 10) / 10), 6.5, 'end', 'f']);
  });
  (O.xticks || [x0, (x0 + x1) / 2, x1]).forEach(t => {
    out += opLine(['l', PX(t), y + h, PX(t), y + h + 3, 'f', .8]);
    out += opText(['t', PX(t), y + h + 10, String(t), 6.8, 'middle', 'm']);
  });
  out += opLine(['l', x, y + h, x + w, y + h, 'i', 1.2]) + opLine(['l', x, y, x, y + h, 'i', 1.2]);
  series.forEach(s => {
    const d = s.d.map((p, i) => (i ? 'L' : 'M') + fnum(PX(p[0])) + ' ' + fnum(PY(p[1]))).join(' ');
    out += '<path d="' + d + '" fill="none" stroke="' + col(s.c || 'b') + '" stroke-width="' + (s.w || 1.8) + '" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>';
    if (s.n) {
      const last = s.d[s.d.length - 1];
      out += opText(['t', PX(last[0]) + 3, PY(last[1]) + 2.5, s.n, 7, 'start', s.c || 'b', 600]);
    }
    if (s.pts !== false) s.d.forEach(p => { out += '<circle cx="' + fnum(PX(p[0])) + '" cy="' + fnum(PY(p[1])) + '" r="1.7" fill="' + col(s.c || 'b') + '"/>'; });
  });
  if (O.titre) out += opText(['t', x + w / 2, y - 5, O.titre, 8, 'middle', 'i', 600]);
  return out;
}
/* cartouche d'organigramme */
function opBox(o) {
  const [, x, y, w, h, titre, c, sous] = o;
  const cc = c || 'b';
  let out = opRect(['r', x, y, w, h, cc + ':14', cc, 3]);
  const lines = String(titre).split('|');
  const tot = lines.length + (sous ? 1 : 0);
  lines.forEach((L, i) => {
    out += opText(['t', x + w / 2, y + h / 2 + 2.8 - (tot - 1) * 4.4 + i * 8.8, L, 7.8, 'middle', cc, 700]);
  });
  if (sous) out += opText(['t', x + w / 2, y + h / 2 + 2.8 - (tot - 1) * 4.4 + lines.length * 8.8, sous, 6.8, 'middle', 'm', 400]);
  return out;
}

/* ---------- assemblage ---------- */
const OPS = {
  t: opText, l: opLine, r: opRect, c: opCirc, poly: opPoly, path: opPath,
  a: opArrow, ca: opCurve, hatch: opHatch, sym: opSym, key: opKey, rose: opRose,
  map: opMap, frise: opFrise, bars: opBars, courbe: opCourbe, box: opBox,
  ancre: opAncre, flux: opFlux, bande: opBande, aire: opAire
};
function figSVG(ops, w, h) {
  let body = '';
  for (const o of ops) {
    const f = OPS[o[0]];
    if (f) { try { body += f(o); } catch (e) { console.warn('op', o[0], e.message); } }
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" xmlns="http://www.w3.org/2000/svg">' + body + '</svg>';
}
function fig(ops, w, h, cap) {
  const disp = Math.min(900, Math.round(w * 2.35));
  return '<figure class="figure"><div class="figbox" style="max-width:' + disp + 'px">' +
    figSVG(ops, w, h) + '</div>' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';
}

</script>

    ['anec', 'Le chauffeur qui a raté son virage', 'Le 28 juin 1914, à Sarajevo, une première bombe rate l’archiduc <strong>François-Ferdinand</strong>, héritier d’Autriche-Hongrie. L’attentat a échoué, les conspirateurs se dispersent. L’un d’eux, Gavrilo Princip, 19 ans, va manger un sandwich. Une heure plus tard, le chauffeur de l’archiduc se trompe de rue, fait marche arrière… et s’arrête à trois mètres de Princip. Deux coups de feu. L’Histoire tient parfois à un demi-tour raté.'],
    ['h', 'Cinq semaines pour basculer'],
    ['p', 'L’Autriche-Hongrie, soutenue par l’Allemagne (le fameux « chèque en blanc »), adresse à la Serbie un ultimatum inacceptable. La Serbie accepte presque tout : ce n’est pas assez. L’enchaînement est alors mécanique.'],
    ['rep', [

    ['note', 'Le 31 juillet 1914, <strong>Jean Jaurès</strong>, chef socialiste et principale voix pacifiste française, est assassiné au café du Croissant à Paris. Sa mort prive la France de son plus grand opposant à la guerre au moment décisif. Aux obsèques, le secrétaire de la CGT lance : « Nous entrons dans la guerre le cœur brisé. »'],
    ['h', 'La « fleur au fusil » : un mythe à nuancer'],
    ['p', 'On imagine souvent des foules en délire poussant les soldats vers la gare. La réalité est plus grave : les rapports de préfets montrent une France <strong>résignée</strong> plutôt qu’enthousiaste, surtout dans les campagnes où l’on part en pleine moisson. Mais tous partent : sur 3,7 millions d’hommes appelés, moins de 1,5 % désertent, alors que l’état-major en attendait 13 %. C’est ce qu’on appellera l’<strong>Union sacrée</strong> : socialistes, catholiques et républicains se rangent derrière le gouvernement.'],
    ['p', 'De part et d’autre, une conviction partagée : la guerre sera courte. « Vous serez rentrés avant la chute des feuilles », promet l’empereur Guillaume II à ses troupes. Elle durera <strong>1 561 jours</strong>.'],

{
  id: 'h2', m: 'hist', th: 'L’Europe, un théâtre majeur des guerres totales',
  t: 'La Grande Guerre, une guerre totale',
  d: 'Trois phases, des tranchées, et une société entière mise au service du front : la définition même de la guerre totale.',
  mo: ['guerre totale', 'tranchée', 'économie de guerre', 'propagande'],
  sec: [
    ['p', 'La Première Guerre mondiale n’est pas seulement plus longue que les précédentes : elle est d’une <strong>autre nature</strong>. Elle mobilise non seulement les armées, mais l’économie, la science, les colonies, les femmes, les enfants, l’opinion. C’est ce qu’on appelle une <strong>guerre totale</strong>.'],
    ['def', [['Guerre totale', 'guerre dans laquelle un État mobilise toutes ses ressources — humaines, économiques, scientifiques, idéologiques — et efface la frontière entre le front et l’arrière.']]],

    ['fig', [

    ], 272, 101, 'Les trois phases du conflit : deux guerres de mouvement encadrent quatre années de tranchées.'],
    ['ol', [
      '<strong>1914 : la guerre de mouvement.</strong> L’Allemagne applique le plan Schlieffen — écraser la France en six semaines par la Belgique, puis se retourner contre la Russie. Le 6 septembre, la contre-offensive de la <strong>Marne</strong> stoppe l’avancée à 40 km de Paris. Puis chacun tente de déborder l’autre par le nord : c’est la « course à la mer ». Fin novembre, le front est figé de la mer du Nord à la Suisse.',
      '<strong>1915-1917 : la guerre de position.</strong> 700 km de tranchées. Les offensives coûtent des centaines de milliers d’hommes pour quelques kilomètres. Verdun (1916) et la Somme (1916) en sont les symboles.',
      '<strong>1918 : le retour du mouvement.</strong> L’arrivée massive des Américains et les chars alliés brisent le front. Le 11 novembre 1918 à 11 h, l’<strong>armistice</strong> est signé à Rethondes.'
    ]],
    ['anec', 'La Marne en taxi', 'Dans la nuit du 6 au 7 septembre 1914, le général Gallieni réquisitionne <strong>630 taxis parisiens</strong> pour transporter environ 4 000 soldats vers le front de la Marne. Militairement, l’apport est modeste — l’essentiel des renforts arrive par train. Mais l’image des « taxis de la Marne » traversant la nuit devient immédiatement un symbole : la nation entière, jusqu’aux chauffeurs de fiacre, est en guerre. Détail savoureux : la course a été facturée à l’État, au tarif du compteur, avec une remise de 27 %.'],
    ['h', 'La tranchée : un monde souterrain'],
    ['p', 'Le soldat de 1916 vit dans un boyau de terre profond de deux mètres, protégé par des barbelés et de la boue. Il y côtoie les rats, les poux (le « toto »), les cadavres. On y reste 4 à 8 jours, puis on redescend au repos. La <strong>violence de masse</strong> y prend une forme nouvelle : 70 % des morts sont dues à l’<strong>artillerie</strong>, et non aux balles ou aux baïonnettes. On meurt sans avoir vu l’ennemi.'],
    ['fig', [

      ['l', 70, 44, 204, 44, 'm', 1, '2 2'], ['l', 70, 80, 204, 80, 'm', 1, '2 2'],
      ['t', 137, 20, 'La ligne de front, de la mer du Nord à la Suisse : 700 km', 8, 'middle', 'i', 600],

    ], 280, 90, 'Coupe schématique du front en 1916. Le no man’s land est balayé par les mitrailleuses : sortir de la tranchée, c’est mourir.'],
    ['doc', 'Lettre d’un poilu, Verdun, mai 1916',
      'Nous sommes restés cinquante-deux heures sans manger, sans boire autre chose que l’eau des trous d’obus. On ne dort plus, on ne pense plus. Quand la marmite tombe à côté, on n’a même plus peur : on est trop fatigué pour avoir peur. Je ne sais plus quel jour nous sommes.',
      'Lettre reproduite d’après les recueils de correspondances de poilus (texte reconstitué à partir de plusieurs témoignages).'],
    ['h', 'L’arrière mobilisé'],
    ['p', 'Une guerre totale se gagne aussi dans les usines. La France produit <strong>200 000 obus par jour</strong> en 1918, contre 10 000 en 1914. Les femmes remplacent les hommes : ce sont les <strong>munitionnettes</strong>, 400 000 dans les usines d’armement, souvent la peau jaunie par le TNT (on les surnomme les « canaris »). Les colonies fournissent hommes et matières premières : 600 000 soldats coloniaux combattent pour la France.'],
    ['chiffres', [

    ['h', 'Contrôler les esprits'],
    ['p', 'L’État censure la presse et diffuse une <strong>propagande</strong> optimiste : c’est le « bourrage de crâne ». Les journaux affirment que les balles allemandes ne percent pas la peau, que les poilus sont joyeux. Les soldats, eux, lisent ces articles dans la boue — ce décalage nourrit un ressentiment durable envers l’arrière. Un journal de tranchée, <em>Le Crapouillot</em>, se moque férocement de cette presse.'],
    ['anec', 'Le Noël qui n’aurait pas dû avoir lieu', 'Le 24 décembre 1914, sur plusieurs points du front, des soldats allemands allument des bougies et chantent <em>Stille Nacht</em>. En face, des Britanniques répondent. On sort des tranchées, on échange du tabac, des boutons d’uniforme ; on enterre les morts ensemble ; on joue même au football entre deux lignes. Les états-majors, horrifiés, interdiront toute fraternisation les années suivantes, sous peine de conseil de guerre. Cette trêve de Noël est restée le symbole de l’humanité qui subsiste dans l’inhumain.'],

{
  id: 'h3', m: 'hist', th: 'L’Europe, un théâtre majeur des guerres totales',
  t: 'Verdun, la Somme : l’expérience combattante',
  d: 'Deux batailles de 1916 qui résument la guerre industrielle — et ce qu’elle fait aux hommes qui la subissent.',
  mo: ['Verdun', 'Somme', 'violence de masse', 'mutineries'],
  sec: [
    ['p', 'En 1916, les états-majors cherchent la percée décisive. Ils obtiennent deux abattoirs. Verdun et la Somme sont devenues les noms mêmes de l’absurde : après dix mois de combats à Verdun, le front n’a pratiquement pas bougé.'],
    ['h', 'Verdun : « saigner à blanc » l’armée française'],
    ['p', 'Le général allemand Falkenhayn choisit Verdun non pour sa valeur stratégique, mais parce qu’il sait que la France défendra cette place symbolique jusqu’au dernier homme. L’objectif avoué est de <strong>l’épuiser</strong>. L’attaque commence le 21 février 1916 par un bombardement de neuf heures : un million d’obus.'],
    ['p', 'Côté français, Pétain organise la <strong>noria</strong> : les divisions se relaient toutes les deux semaines, si bien que 70 % de l’armée française passera par Verdun. Le ravitaillement emprunte une unique route depuis Bar-le-Duc, la « <strong>Voie sacrée</strong> » : un camion toutes les 14 secondes, jour et nuit, pendant dix mois.'],
    ['fig', [

    ], 280, 126, 'La bataille de Verdun : une guerre d’usure sur quelques kilomètres carrés. 10 mois de combats · environ 300 000 morts · le front bouge de quelques kilomètres'],
    ['chiffres', [
      ['300 000', 'morts à Verdun'],
      ['60 M', 'd’obus tirés en 10 mois'],
      ['1,2 M', 'morts et blessés dans la Somme'],
      ['20 km', 'gagnés au total dans la Somme']

    ['anec', 'La tranchée des baïonnettes', 'Après la guerre, on découvre près de Douaumont une ligne de baïonnettes sortant du sol, comme si un bataillon entier avait été enseveli debout, l’arme au clair. La légende fait le tour du monde ; un mécène américain finance un monument. Les historiens ont depuis établi la vérité, moins héroïque et plus terrible : les corps ont probablement été enterrés là par leurs camarades, fusils plantés pour marquer les tombes, avant que les obus ne nivellent tout. Le mythe et le fait coexistent au même endroit — c’est aussi cela, l’histoire de 1914-1918.'],
    ['h', 'La Somme : le jour le plus meurtrier de l’armée britannique'],
    ['p', 'Le 1ᵉʳ juillet 1916, l’offensive franco-britannique de la Somme s’ouvre après une semaine de bombardement censé avoir tout détruit. Les Allemands, abrités dans des galeries profondes, remontent leurs mitrailleuses en trois minutes. Ce seul jour coûte <strong>19 240 morts</strong> aux Britanniques — le pire de leur histoire militaire. La bataille dure jusqu’en novembre et voit apparaître, le 15 septembre, une machine nouvelle : le <strong>char d’assaut</strong>.'],
    ['h', 'Ce que la guerre fait aux hommes'],
    ['p', 'L’<strong>expérience combattante</strong> désigne tout ce que vivent les soldats : la peur, la camaraderie, l’ennui, la brutalisation. Les blessures nouvelles aussi : les « <strong>gueules cassées</strong> », visages arrachés par les éclats, qui inspirent la naissance de la chirurgie reconstructrice. Ou l’<em>obusite</em> (le <em>shell shock</em>), traumatisme psychique longtemps confondu avec la lâcheté.'],
    ['p', 'Au printemps 1917, après l’échec sanglant de l’offensive du Chemin des Dames, éclatent des <strong>mutineries</strong> : dans une quarantaine de divisions, des soldats refusent de remonter en ligne. Ils ne veulent pas la paix à tout prix — ils refusent les assauts inutiles. Pétain rétablit l’ordre par un mélange de sanctions (49 fusillés) et de réformes concrètes : meilleures permissions, meilleure nourriture, fin des offensives massives.'],
    ['note', 'Attention au contresens fréquent : les mutins de 1917 ne sont pas des déserteurs. La grande majorité accepte de tenir les tranchées ; ils refusent seulement de <em>monter à l’attaque</em>. C’est une grève, pas une trahison.'],
    ['doc', 'Chanson de Craonne (chant de mutins, 1917)',
