{
  id: 'h4', m: 'hist', th: 'L’Europe, un théâtre majeur des guerres totales',
  t: '1917, l’année des ruptures',
  d: 'Deux révolutions à Petrograd, une entrée en guerre à Washington : l’année où le XXᵉ siècle change de direction.',
  mo: ['révolution de Février', 'révolution d’Octobre', 'Lénine', 'soviet'],
  sec: [
    ['p', '1917 est l’année où tout bascule. La Russie sort de la guerre par une révolution ; les États-Unis y entrent. Le monde qui naît de ces deux événements — un monde partagé entre communisme et démocratie libérale — durera jusqu’en 1991.'],
    ['h', 'Février : la chute du tsar'],
    ['p', 'L’Empire russe est le pays le plus vaste et l’un des plus pauvres d’Europe. Le tsar <strong>Nicolas II</strong> gouverne en autocrate. La guerre y est un désastre : 2 millions de morts, des soldats envoyés au front sans fusil, des villes affamées.'],
    ['p', 'Le 23 février 1917 (calendrier russe ; 8 mars pour nous), des ouvrières de Petrograd manifestent pour le pain, à l’occasion de la Journée internationale des femmes. La grève devient générale. Les soldats envoyés pour tirer sur la foule… rejoignent la foule. Le 2 mars, Nicolas II abdique. Trois siècles de dynastie Romanov s’effondrent en huit jours.'],
    ['p', 'Un <strong>gouvernement provisoire</strong> libéral prend le pouvoir. Mais il commet une erreur fatale : continuer la guerre. Face à lui se dressent les <strong>soviets</strong>, conseils élus d’ouvriers et de soldats. C’est le « double pouvoir ».'],
    ['def', [
      ['Soviet', 'en russe, « conseil » : assemblée élue d’ouvriers, de paysans ou de soldats.'],
      ['Bolchevik', 'membre du parti communiste russe dirigé par Lénine ; le mot signifie « majoritaire ».'],
      ['Autocratie', 'régime où un seul homme détient tous les pouvoirs sans contrôle.']
    ]],
    ['anec', 'Le train plombé', 'En 1917, <strong>Lénine</strong> est exilé en Suisse. L’état-major allemand comprend son intérêt : cet homme veut la paix immédiate, donc la sortie de la Russie du conflit. Berlin organise son retour dans un wagon scellé qui traverse l’Allemagne en guerre — un « bacille de peste envoyé en Russie », écrira Churchill. Le 3 avril 1917, Lénine descend du train à la gare de Finlande et lance ses <em>Thèses d’avril</em> : « Tout le pouvoir aux soviets ! » Le pari allemand est gagné… et coûtera très cher au monde entier.'],
    ['h', 'Octobre : la prise du pouvoir'],
    ['p', 'Dans la nuit du 24 au 25 octobre 1917 (7 novembre), les bolcheviks de Lénine et Trotski s’emparent des points stratégiques de Petrograd, puis du palais d’Hiver. Le coup de force fait… six morts. Les décrets tombent aussitôt : paix immédiate, partage des terres aux paysans, contrôle des usines par les ouvriers.'],
    ['note', 'Le film <em>Octobre</em> d’Eisenstein (1927) met en scène un assaut héroïque du palais d’Hiver avec des milliers de figurants. Cette reconstitution a fait plus de blessés que la prise réelle du palais. Attention : ce film est de la <strong>propagande</strong>, pas un document sur l’événement.'],
    ['p', 'En mars 1918, le traité de <strong>Brest-Litovsk</strong> sort la Russie de la guerre au prix de pertes territoriales énormes. Puis le pays plonge dans une <strong>guerre civile</strong> (1918-1921) entre Rouges et Blancs : 5 millions de morts, la famine, la Tchéka (police politique) et la « terreur rouge ». L’URSS naît officiellement en 1922.'],
    ['fig', [
      ['frise', 18, 62, 236, 1917, 1923, [
        [1917.15, 'Février : le tsar abdique', 'b', 1],
        [1917.83, 'Octobre : les bolcheviks', 'h', 1],
        [1918.2, 'Brest-Litovsk', 'w', -1],
        [1922, 'Naissance de l’URSS', 'h', -1],
        [1921, 'Fin de la guerre civile', 'm', 1]
      ], { periodes: [[1918, 1921, 'guerre civile russe', 'k']], graduation: 1 }]
    ], 272, 103, 'De la chute du tsar à la naissance de l’URSS.'],
    ['h', 'L’entrée en guerre des États-Unis'],
    ['p', 'Le 6 avril 1917, les États-Unis déclarent la guerre à l’Allemagne. Deux raisons : la guerre sous-marine à outrance (le paquebot <em>Lusitania</em> coulé en 1915 avec 128 Américains à bord) et le <strong>télégramme Zimmermann</strong>, message secret où Berlin propose au Mexique de récupérer le Texas s’il attaque les États-Unis — intercepté et publié par les Britanniques.'],
    ['p', 'L’apport est d’abord financier et matériel, puis humain : 2 millions de « <em>Sammies</em> » débarquent en 1918. Surtout, le président <strong>Wilson</strong> donne à la guerre un sens nouveau avec ses « <strong>14 points</strong> » (janvier 1918) : droit des peuples à disposer d’eux-mêmes, diplomatie ouverte, création d’une Société des Nations.'],
    ['keep', [
      'Février 1917 : la révolution renverse le tsar Nicolas II ; double pouvoir entre gouvernement provisoire et soviets.',

      'Guerre civile (1918-1921), puis naissance de l’URSS en 1922.',

{
  id: 'h5', m: 'hist', th: 'L’Europe, un théâtre majeur des guerres totales',
  t: 'Sortir de la guerre : 1918-1923',
  d: 'Un armistice, un traité de paix contesté, des empires qui disparaissent et des sociétés à reconstruire.',
  mo: ['armistice', 'traité de Versailles', 'SDN', 'Diktat'],
  sec: [
    ['p', 'La guerre s’arrête le 11 novembre 1918 à 11 heures. Mais on ne sort pas d’une guerre totale comme on sort d’un match : il faut démobiliser des millions d’hommes, enterrer les morts, redessiner un continent et reconstruire des sociétés blessées.'],
    ['h', 'Un bilan vertigineux'],
    ['chiffres', [
      ['10 M', 'de morts militaires'],
      ['1,4 M', 'de morts français (1 soldat sur 6)'],
      ['6 M', 'de blessés et d’invalides'],
      ['3 M', 'de veuves en Europe']

{

{

    ['p', 'Libérer la France ne suffit pas : il faut la refaire. Entre 1944 et 1947, en trois ans, la France se dote d’institutions nouvelles, d’un modèle social et d’une mémoire — le tout dans un pays en ruines, rationné, où le pain reste tiqueté jusqu’en 1949.'],

    ['p', 'Adopté clandestinement en mars 1944, le programme du Conseil national de la Résistance, intitulé « <em>Les Jours heureux</em> », est appliqué à la Libération :'],
    ['ul', [
      '<strong>Sécurité sociale</strong> (ordonnances d’octobre 1945) : assurance maladie, retraites, allocations familiales, financées par des cotisations. « De chacun selon ses moyens, à chacun selon ses besoins. »',

{

    ['anec', 'Une frontière tracée en cinq semaines', 'En 1947, le Britannique Cyril Radcliffe est chargé de tracer la frontière entre l’Inde et le Pakistan. Il n’était jamais allé en Inde, il n’y connaissait personne — ce qui, pensait-on, garantissait son impartialité. Il dispose de cinq semaines et de cartes parfois périmées. La ligne qu’il trace coupe des villages, des champs et des systèmes d’irrigation. La partition provoque le déplacement de <strong>15 millions de personnes</strong> et des violences qui font plusieurs centaines de milliers de morts. Radcliffe refusa son salaire et brûla ses notes en quittant l’Inde.'],

    ['p', 'En avril 1955, à <strong>Bandung</strong> (Indonésie), 29 pays d’Asie et d’Afrique se réunissent. Ils condamnent le colonialisme, affirment l’égalité des races et des nations, et refusent de choisir entre les deux blocs : c’est le <strong>non-alignement</strong>. Le démographe Alfred Sauvy avait forgé en 1952 l’expression « <strong>tiers-monde</strong> », par analogie avec le tiers état de 1789 : « ce tiers-monde ignoré, exploité, méprisé, veut, lui aussi, être quelque chose ».'],

{
  id: 'h16', m: 'hist', th: 'Le monde depuis 1945',
  t: 'La guerre d’Algérie (1954-1962)',
  d: 'Une guerre qui n’a pas dit son nom pendant quarante ans, et qui a fait tomber une République.',
  mo: ['FLN', 'Toussaint rouge', 'accords d’Évian', 'pieds-noirs'],
  sec: [
    ['p', 'L’Algérie n’est pas une colonie comme les autres : depuis 1848, elle est composée de <strong>départements français</strong>. Un million d’Européens (les « pieds-noirs ») y vivent aux côtés de neuf millions de « Français musulmans » qui, jusqu’en 1958, ne disposent pas des mêmes droits électoraux. C’est cette contradiction — un territoire français où tous ne sont pas des citoyens égaux — qui rend la guerre inévitable et si douloureuse.'],
    ['h', 'De la Toussaint rouge à la guerre totale'],
    ['rep', [
      ['1ᵉʳ novembre 1954', '« Toussaint rouge » : le FLN lance une série d’attentats. Le ministre Mitterrand déclare : « L’Algérie, c’est la France. »'],

      ['1957', 'Bataille d’Alger : l’armée démantèle le FLN dans la Casbah, au prix d’une pratique systématique de la torture.'],
      ['13 mai 1958', 'Émeutes à Alger : la IVᵉ République s’effondre, de Gaulle revient au pouvoir.'],
      ['16 septembre 1959', 'De Gaulle reconnaît le droit à l’autodétermination.'],
      ['1961', 'Putsch des généraux à Alger ; création de l’OAS, qui multiplie les attentats.'],

    ['p', 'Officiellement, il ne s’agit pas d’une guerre mais d’« opérations de maintien de l’ordre ». Cette fiction juridique permet d’envoyer des appelés du contingent — <strong>1,5 million de jeunes Français</strong> feront leur service militaire en Algérie — sans déclarer l’état de guerre. La France ne reconnaîtra le mot « guerre » qu’en… <strong>1999</strong>, par un vote de l’Assemblée nationale.'],
    ['p', 'Le conflit est marqué par des violences extrêmes des deux côtés : attentats aveugles du FLN, massacres de villages, <strong>torture</strong> pratiquée par l’armée française, regroupements forcés de populations, exécutions de « harkis » après 1962.'],
    ['anec', 'Un film interdit pendant cinq ans', 'Le film <em>La Bataille d’Alger</em> (1966) de Gillo Pontecorvo reconstitue les événements de 1957 avec une telle rigueur qu’il fut longtemps pris pour un documentaire — le générique dut préciser qu’il ne contenait « pas une seule image d’actualité ». Interdit de fait en France jusqu’en 1971, il est aujourd’hui projeté dans les écoles militaires du monde entier, y compris au Pentagone en 2003, pour réfléchir aux guerres asymétriques.'],
    ['h', 'Un bilan lourd et des mémoires blessées'],
    ['chiffres', [

      ['1 M', 'de pieds-noirs rapatriés en 1962'],
      ['1999', 'reconnaissance officielle du mot « guerre »']

    ['p', 'Le 17 octobre 1961, une manifestation pacifique d’Algériens à Paris est réprimée par la police : plusieurs dizaines de morts, des corps jetés dans la Seine. L’événement sera occulté pendant des décennies. Aujourd’hui, plusieurs mémoires coexistent en France : celle des appelés, des pieds-noirs, des harkis, des immigrés algériens et de leurs descendants. Les travaux d’historiens (rapport Stora, 2021) et l’ouverture progressive des archives visent à les faire dialoguer plutôt que s’affronter.'],
    ['keep', [

{

  t: 'Médias, information et esprit critique',

  mo: ['liberté de la presse', 'source', 'infox', 'complotisme'],
  sec: [
    ['p', 'La <strong>liberté d’expression</strong> est proclamée par l’article 11 de la Déclaration de 1789 et organisée par la loi du <strong>29 juillet 1881</strong> sur la liberté de la presse, l’une des plus libérales du monde. Elle a des limites, précisément définies : diffamation, injure, incitation à la haine, apologie du terrorisme, négationnisme, atteinte à la vie privée.'],
    ['h', 'Une révolution de l’information'],
    ['p', 'En trente ans, tout a changé. Avant, quelques rédactions choisissaient ce qui devenait une information — on parlait de « gatekeepers ». Aujourd’hui, chacun peut publier instantanément devant le monde entier. C’est une immense conquête démocratique, et une immense fragilité : l’information circule <strong>plus vite que sa vérification</strong>. Une étude du MIT publiée en 2018 a montré qu’une fausse information se diffuse en moyenne <strong>six fois plus vite</strong> qu’une information vraie sur les réseaux sociaux, parce qu’elle est plus surprenante.'],

      ['box', 8, 58, 130, 24, 'OÙ ?', 'w', 'Le lieu réel ? Recherche d’image inversée'],

      ['Complotisme', 'récit qui explique un événement par un complot secret, et qui interprète toute contradiction comme une preuve supplémentaire du complot.'],
      ['Bulle de filtre', 'effet des algorithmes qui te montrent surtout ce qui te ressemble, réduisant la diversité des points de vue auxquels tu es exposé.']

    ['anec', 'Le canular martien de 1938', 'Le 30 octobre 1938, Orson Welles diffuse à la radio américaine une adaptation de <em>La Guerre des mondes</em> sous forme de faux flashs d’information annonçant l’invasion de la Terre par des Martiens. Une partie des auditeurs, arrivés en cours d’émission, y crut. La légende parle d’une panique nationale ; les historiens ont depuis établi qu’elle fut très largement exagérée — par les journaux, ravis de démontrer que la radio, leur concurrente, était dangereuse. L’histoire de la panique est donc elle-même… une fausse information sur une fausse information. Elle reste enseignée pour cela.'],

  'Le général Gallieni réquisitionne les taxis parisiens pour transporter environ 4 000 soldats vers la Marne. L’apport militaire est modeste — l’essentiel arrive par train — mais l’image devient immédiatement un <strong>symbole de la nation en armes</strong>. Détail savoureux : la course fut facturée à l’État au tarif du compteur, avec 27 % de remise.',

K('h05', 'hist', 'mon', 'Le soldat inconnu', 'Un corps choisi entre huit, sous l’Arc de Triomphe.',
  'Le 10 novembre 1920, huit cercueils de soldats non identifiés sont alignés dans la citadelle de Verdun. Auguste Thin, jeune soldat fils de poilu, additionne les chiffres de son régiment (132ᵉ : 1+3+2 = 6) et dépose son bouquet sur le <strong>sixième cercueil</strong>. La flamme est ravivée chaque soir à 18 h 30 depuis 1923 — sans interruption, y compris sous l’Occupation.',

K('h06', 'hist', 'tem', 'Le train plombé de Lénine', 'Un wagon scellé qui traverse l’Allemagne en guerre.',
  'En avril 1917, l’état-major allemand fait traverser son territoire à Lénine, exilé en Suisse, dans un wagon scellé. Le calcul est simple : cet homme veut la paix immédiate, donc la sortie de la Russie du conflit. Churchill écrira qu’on avait envoyé Lénine en Russie « <strong>comme un bacille de peste</strong> ». Le 3 avril, il descend à la gare de Finlande et lance : « Tout le pouvoir aux soviets ! »',

K('h07', 'hist', 'arc', 'Le wagon de Rethondes', 'Le même wagon pour deux armistices.',
  'Le 11 novembre 1918, l’armistice est signé dans le wagon-restaurant n° 2419 D du maréchal Foch, en forêt de Compiègne. Le 22 juin 1940, Hitler exige que la capitulation française soit signée <strong>dans le même wagon, au même endroit</strong> : on le fait sortir du musée et on le replace exactement sur ses rails d’origine. Le wagon sera détruit en 1945.',

K('h08', 'hist', 'tra', 'L’affiche de propagande', 'Convaincre, mobiliser, faire taire.',
  'Toutes les puissances en guerre ont massivement utilisé l’affiche : emprunts nationaux, engagement, dénonciation de l’ennemi. Les codes sont constants — <strong>un visage qui regarde le lecteur, un impératif, une couleur dominante</strong>. Savoir décrypter une affiche (qui la commande ? à qui parle-t-elle ? que veut-elle obtenir ?) est un savoir-faire attendu au brevet.',

K('h09', 'hist', 'tem', 'La croix gammée renversée', 'L’Allemagne bascule en dix-huit mois.',

K('h10', 'hist', 'mon', 'Le mur de Berlin', 'Cent cinquante-cinq kilomètres qui coupent une ville.',
  'Construit dans la nuit du 12 au 13 août 1961 pour stopper l’hémorragie de la RDA (2,6 millions de départs depuis 1949), le mur fait 155 km de long, dont 43 en pleine ville. Ce n’est pas un simple mur mais un <strong>dispositif</strong> : mur extérieur, « bande de la mort » éclairée, chemin de ronde, miradors, second mur. Au moins 140 personnes y ont perdu la vie.',

K('h13', 'hist', 'leg', 'La crise des missiles de Cuba', 'Treize jours au bord de l’abîme.',
  'En octobre 1962, un avion espion américain photographie des rampes de missiles soviétiques à Cuba, à 150 km des côtes de Floride. Kennedy impose un blocus naval ; les navires soviétiques font demi-tour à quelques milles de la ligne. En échange du retrait des missiles, les États-Unis s’engagent secrètement à retirer les leurs de Turquie. Le « <strong>téléphone rouge</strong> » entre Washington et Moscou naît de cette peur.',

K('h15', 'hist', 'del', 'L’appel du 18 juin', 'Une voix que presque personne n’a entendue.',
  'Le 18 juin 1940 à 18 h, un général de brigade à titre temporaire, inconnu du grand public, parle quatre minutes au micro de la BBC. Aucun enregistrement de ce premier appel n’a été conservé — ce que l’on entend aujourd’hui est la version du 22 juin. Le texte, placardé sur les murs de Londres puis recopié clandestinement, deviendra l’<strong>acte fondateur de la France libre</strong> et sera inscrit au registre Mémoire du monde de l’UNESCO.',

K('h17', 'hist', 'tem', 'Le message codé de Radio Londres', 'Verlaine annonce le débarquement.',

K('h19', 'hist', 'mon', 'La Sécurité sociale', 'Ordonnances d’octobre 1945.',

K('h21', 'hist', 'arc', 'Les congés payés de 1936', 'Deux semaines, et la mer pour la première fois.',

K('h22', 'hist', 'tra', 'Le plan Marshall', 'Treize milliards de dollars pour l’Europe.',

K('h23', 'hist', 'leg', 'La chute du mur', 'Un empire tombe sur un malentendu.',
  'Le 9 novembre 1989 au soir, le porte-parole est-allemand Günter Schabowski lit un texte qu’il n’a pas relu. Un journaliste demande : « À partir de quand ? » Il hésite, feuillette, puis lâche : « <strong>Sofort, unverzüglich</strong> » — tout de suite, sans délai. La mesure devait être encadrée et prendre effet le lendemain. Quelques heures plus tard, la foule force les checkpoints. Les gardes, sans ordre, ouvrent.',

K('h24', 'hist', 'tem', 'Le drapeau européen', 'Douze étoiles qui ne comptent personne.',
  'Adopté en 1955 par le Conseil de l’Europe, repris par la CEE en 1985, le drapeau porte douze étoiles alors que l’Union a compté 6, 9, 12, 15, 25, 28 puis 27 membres. Le nombre <strong>ne désigne pas les États</strong> : douze est un symbole de plénitude (les mois, les heures). C’est pourquoi il n’a jamais fallu le modifier, même après le Brexit.',

K('h25', 'hist', 'arc', 'La déclaration Schuman', 'Le charbon et l’acier contre la guerre.',
  'Le 9 mai 1950, dans le salon de l’Horloge du Quai d’Orsay, Robert Schuman lit un texte rédigé par Jean Monnet : mettre en commun la production franco-allemande de charbon et d’acier — les deux matières premières de la guerre. La phrase clé : rendre la guerre « <strong>non seulement impensable, mais matériellement impossible</strong> ».',

K('h26', 'hist', 'tra', 'Le plan quinquennal', 'Cinq ans pour rattraper cent ans de retard.',
  'À partir de 1928, l’État soviétique fixe pour cinq ans des objectifs chiffrés de production, avec priorité absolue à l’industrie lourde. Les affiches claironnent « le plan en quatre ans ! ». Les résultats sont réels — l’URSS devient la deuxième puissance industrielle mondiale — mais obtenus par la contrainte, la falsification des chiffres et un coût humain considérable.',

K('h27', 'hist', 'tem', 'Le procès de Nuremberg', 'Juger l’injugeable.',

K('h28', 'hist', 'mon', 'La Voie lactée des indépendances', '1960, l’année de l’Afrique.',
  'En 1960, dix-sept États africains deviennent indépendants, dont quatorze anciennes colonies françaises. L’ONU passe de 51 membres en 1945 à 99 en 1960. Les frontières héritées de la colonisation, souvent tracées à la règle lors de la conférence de Berlin (1885), sont conservées telles quelles — un choix assumé pour éviter des guerres frontalières en chaîne.',

K('h29', 'hist', 'arc', 'La bataille de Stalingrad', 'Se battre étage par étage.',

K('h30', 'hist', 'del', 'La flamme du souvenir', 'Ravivée chaque soir depuis cent ans.',
  'Depuis le 11 novembre 1923, la flamme de la tombe du Soldat inconnu est ravivée chaque soir à 18 h 30, sans une seule interruption — y compris pendant les quatre années d’Occupation, où la cérémonie fut maintenue sous le regard des soldats allemands, devenant un acte de résistance silencieuse. C’est la plus longue cérémonie ininterrompue de France.',

K('h31', 'hist', 'tra', 'La chronologie', 'L’outil de base de l’historien.',
  'Une frise chronologique n’est pas une décoration : c’est un raisonnement. Elle rend visible ce qu’un texte peine à dire — les <strong>durées</strong>, les <strong>simultanéités</strong>, les <strong>ruptures</strong>. Placer côte à côte 1917 (révolutions russes) et 1917 (entrée en guerre des États-Unis) fait immédiatement comprendre pourquoi cette année a fait basculer le siècle.',

K('h32', 'hist', 'tem', 'Le totalitarisme', 'Quatre piliers, deux régimes.',

K('h33', 'hist', 'arc', 'Le tank de la Somme', 'Le 15 septembre 1916, une machine sort du brouillard.',
  'Les premiers chars britanniques Mark I sont si secrets qu’on les expédie sous l’étiquette « <em>water tanks for Russia</em> » — réservoirs d’eau pour la Russie. Le mot « tank » restera. Sur 49 engagés, une trentaine seulement atteint la ligne de départ : ils tombent en panne, s’enlisent, chauffent à 50 °C à l’intérieur. Mais la brèche psychologique est ouverte.',

K('h34', 'hist', 'mon', 'Le Panthéon', 'Aux grands hommes — et femmes — la patrie reconnaissante.',
  'Ancienne église transformée en nécropole républicaine en 1791, le Panthéon abrite les personnes que la République choisit d’honorer. Il a fallu attendre <strong>1995</strong> pour qu’une femme y entre pour ses propres mérites : Marie Curie. Depuis, Germaine Tillion, Geneviève de Gaulle-Anthonioz, Simone Veil (2018) et Joséphine Baker (2021) l’ont rejointe.',

K('h35', 'hist', 'leg', 'Le testing du souvenir', 'Ce que l’histoire fait avec les silences.',
  'Le 17 octobre 1961, une manifestation pacifique d’Algériens à Paris est réprimée par la police : plusieurs dizaines de morts, des corps jetés dans la Seine. Les archives sont scellées, la presse censurée, l’événement disparaît des mémoires pendant trente ans. Il faudra le travail obstiné d’historiens et de familles pour qu’il soit reconnu en 2012. Un fait historique peut être <strong>effacé</strong> puis <strong>retrouvé</strong>.',

K('g08', 'geo', 'mon', 'Le Mont-Saint-Michel', 'L’île qui avait cessé d’en être une.',

K('g11', 'geo', 'arc', 'La dorsale européenne', 'De Londres à Milan, le cœur qui bat.',

K('g12', 'geo', 'mon', 'Le centre spatial de Kourou', 'Sept cents kilomètres carrés de forêt et une fusée.',

K('g13', 'geo', 'tra', 'Le figuré cartographique', 'Trois familles, pas une de plus.',

K('g14', 'geo', 'tem', 'L’étalement urbain', 'Un département de terres perdu tous les dix ans.',

K('g15', 'geo', 'arc', 'Le risque', 'Aléa multiplié par vulnérabilité.',
  'Un volcan qui entre en éruption au milieu du Pacifique, sans personne autour, n’est pas un risque : c’est un aléa. Le risque naît de la <strong>rencontre</strong> entre un phénomène dangereux et des enjeux humains. C’est pourquoi la prévention consiste autant à réduire la vulnérabilité (construire autrement, alerter, éduquer) qu’à surveiller l’aléa.',

K('g16', 'geo', 'leg', 'Les montagnes de Kong', 'Une chaîne inventée qui a duré un siècle.',

K('g17', 'geo', 'tra', 'Le remembrement', 'Quand on a effacé les haies.',

K('g18', 'geo', 'tem', 'Le viaduc de Millau', 'Plus haut que la tour Eiffel.',
  'Achevé en 2004, le viaduc culmine à 343 mètres — 19 de plus que la tour Eiffel. Il devait supprimer les embouteillages légendaires de la vallée du Tarn. Effet inattendu : il est devenu lui-même une attraction touristique majeure, avec près d’un million de visiteurs par an. Un ouvrage conçu pour faire passer les gens les fait s’arrêter.',

K('g19', 'geo', 'mon', 'La carte de Cassini', 'Quatre générations pour mesurer un royaume.',
  'Commencée en 1747, la carte de Cassini est la première carte topographique d’un pays entier fondée sur la triangulation. Il a fallu <strong>quatre générations de la même famille</strong> et près de 70 ans pour la terminer. Ses 181 feuilles portent 40 000 noms de lieux, dont beaucoup ont disparu depuis : elle sert encore aux historiens et aux archéologues.',

K('g20', 'geo', 'del', 'Le planisphère', 'Aucune carte du monde n’est innocente.',
  'Aplatir une sphère sur un plan est mathématiquement impossible sans déformer quelque chose. La projection de Mercator (1569), conçue pour la navigation, conserve les angles mais gonfle énormément les hautes latitudes : le Groenland y paraît aussi grand que l’Afrique, alors qu’il est <strong>quatorze fois plus petit</strong>. Toute carte est un choix, et tout choix a des conséquences politiques.',

K('e01', 'emc', 'tra', 'Marianne', 'Le visage de la République.',
  'Marianne apparaît sous la Révolution, coiffée du <strong>bonnet phrygien</strong> que portaient les esclaves affranchis à Rome. Le prénom, très courant au XVIIIᵉ siècle dans les milieux populaires, a d’abord été un sobriquet moqueur employé par les royalistes — avant d’être revendiqué. Son buste orne toutes les mairies de France.',

  'Jusqu’en 1913, on votait à découvert en France : chacun voyait pour qui vous glissiez votre bulletin. Les députés ont longtemps refusé l’isoloir, importé d’Australie, jugé « une insulte à la sincérité du citoyen ». Il a fallu vingt ans de débats. Aujourd’hui, ne pas passer par l’isoloir peut faire annuler un vote.',

K('e03', 'emc', 'arc', 'La balance de la justice', 'Peser, trancher, protéger.',
  'La justice française repose sur des principes intangibles : <strong>présomption d’innocence</strong>, droits de la défense, débat contradictoire, publicité des audiences, possibilité de faire appel, indépendance du juge. C’est à l’accusation d’apporter la preuve — jamais à l’accusé de démontrer son innocence.',

K('e04', 'emc', 'tem', 'La loi de 1905', 'Séparer pour permettre à chacun de croire.',
  'Deux articles suffisent. Article 1 : la République assure la liberté de conscience et garantit le libre exercice des cultes. Article 2 : elle ne reconnaît, ne salarie ni ne subventionne aucun culte. Ce texte, négocié pendant 48 séances par Aristide Briand, reste l’un des plus cités — et des plus mal cités — du droit français.',

K('e05', 'emc', 'tra', 'Le triptyque républicain', 'Trois mots, une tension permanente.',
  'Liberté, Égalité, Fraternité ne se contredisent pas mais se limitent mutuellement : ma liberté s’arrête où commence celle des autres, l’égalité réelle exige parfois de traiter différemment des situations différentes, la fraternité impose la solidarité. En 2018, le Conseil constitutionnel a donné à la fraternité une <strong>valeur juridique</strong>.',

K('e06', 'emc', 'mon', 'Le Défenseur des droits', 'Une porte gratuite contre l’arbitraire.',
  'Créée en 2011, cette autorité indépendante peut être saisie gratuitement par n’importe qui, en ligne ou par courrier, en cas de discrimination, de difficulté avec un service public, d’atteinte aux droits de l’enfant ou de manquement à la déontologie de la sécurité. Elle traite plus de 100 000 réclamations par an et dispose d’un réseau de délégués dans chaque département.',

K('e07', 'emc', 'tem', 'Le 3020', 'Un numéro contre le harcèlement.',

K('e08', 'emc', 'arc', 'La séparation des pouvoirs', 'Que le pouvoir arrête le pouvoir.',
  'Montesquieu, en 1748, formule le principe qui fonde toutes les démocraties : si un même organe fait la loi, l’applique et juge, il n’y a plus de liberté. En France, le Parlement vote, le gouvernement applique, les juges sanctionnent — et chacun contrôle les autres. La presse est parfois appelée le « quatrième pouvoir ».',

K('e09', 'emc', 'tra', 'La carte d’électeur', 'Un droit conquis, jamais acquis.',

K('e11', 'emc', 'tem', 'L’association loi 1901', 'Deux personnes suffisent.',

/* ---------- generateurs de manches ---------- */
function genFrise(n) {
  return Array.from({ length: n || 5 }, () => {
    const pick5 = shuffle(POOL_DATES).slice(0, 4).sort((a, b) => a[0] - b[0]);
    return {
      ty: 'order', q: 'Remets ces événements du plus ancien au plus récent.',
      o: pick5.map(d => d[1]), sub: pick5.map(d => String(d[0])),
      w: pick5.map(d => d[0] + ' : ' + d[1]).join(' · ')
    };
  });
}
function genDate(n) {
  return shuffle(POOL_DATES).slice(0, n || 6).map(d => ({
    ty: 'slider', q: 'En quelle année ? — ' + d[1], min: 1840, max: 2030, r: d[0], tol: 3,
    w: 'La bonne réponse est ' + d[0] + '.'
  }));
}
function genQui(n) {
  return shuffle(POOL_QUI).slice(0, n || 5).map(p => {
    const opts = shuffle([p[0]].concat(p[2]));
    return { ty: 'choice', q: 'Qui suis-je ?', indices: p[1], o: opts, r: opts.indexOf(p[0]), w: 'C’était ' + p[0] + '.' };
  });
}
function genBloc(n) {
  return shuffle(POOL_BLOC).slice(0, n || 8).map(b => ({
    ty: 'choice', q: b[0], o: ['Bloc de l’Ouest', 'Bloc de l’Est'], r: b[1] === 'ouest' ? 0 : 1,
    w: b[0] + ' relève du bloc de l’' + (b[1] === 'ouest' ? 'Ouest' : 'Est') + '.'
  }));
}
function genIntox(n) {
  return shuffle(POOL_INTOX).slice(0, n || 6).map(a => ({
    ty: 'choice', q: a[0], o: ['C’est vrai', 'C’est une intox'], r: a[1] ? 0 : 1, w: a[2]
  }));
}
function genNotion(n) {
  return shuffle(POOL_NOTION).slice(0, n || 6).map(p => {
    const opts = shuffle([p[1]].concat(p[2]));
    return { ty: 'choice', q: p[0], o: opts, r: opts.indexOf(p[1]), w: 'La notion attendue est : ' + p[1] + '.' };
  });
}
function genFigure(n) {
  return shuffle(POOL_FIGURE).slice(0, n || 6).map(p => {

function genInstit(n) {
  const all = Array.from(new Set(POOL_INSTIT.map(p => p[1])));

    const wrong = shuffle(all.filter(x => x !== p[1])).slice(0, 3);

}
function genMap(pool, mapName, n) {

];
const jeuById = id => JEUX.find(j => j.id === id);

/* ============================================================
   MOTEUR DE JEU
   ============================================================ */
function runGame(host, jeu) {
  const rounds = jeu.gen();
  let i = 0, ok = 0, vies = 3, serie = 0, best = 0;

  function head() {
    return '<div class="gamehead">' +
      '<b style="font-size:16px">' + jeu.i + ' ' + esc(jeu.n) + '</b>' +
      '<span class="pill ' + MAT[jeu.m].cls + '">' + MAT[jeu.m].n + '</span>' +
      '<span class="grow"></span>' +
      '<span class="mono small">Manche ' + Math.min(i + 1, rounds.length) + ' / ' + rounds.length + '</span>' +
      '<span class="hp">' + [0, 1, 2].map(k => '<i class="' + (k < vies ? '' : 'off') + '"></i>').join('') + '</span>' +
      (serie > 1 ? '<span class="streak">' + serie + ' d’affilée</span>' : '') +
      '</div>';
  }

  function finish() {
    const parfait = ok === rounds.length;
    const win = ok >= Math.ceil(rounds.length * .6);
    const d = elo(jeu.diff, win, 20);
    const coins = ok * 12 + (parfait ? 60 : 0), xp = ok * 7 + (parfait ? 30 : 0);
    S.stats.jeux = (S.stats.jeux || 0) + 1;
    const g = S.games[jeu.id] || { parties: 0, best: 0, parfait: false };
    g.parties++; g.best = Math.max(g.best, ok); if (parfait) g.parfait = true;
    S.games[jeu.id] = g;
    gain(coins, xp);
    commit(); checkSucces();
    host.innerHTML = '<div class="board center">' +
      '<div class="eyebrow">Partie terminée</div>' +
      '<div class="score" style="margin:12px 0;color:' + (win ? 'var(--ok)' : 'var(--bad)') + '">' + ok + ' / ' + rounds.length + '</div>' +
      (parfait ? '<p style="color:var(--ok);font-weight:600;margin-bottom:8px">Sans faute !</p>' : '') +
      '<p class="muted" style="margin-bottom:14px">+' + coins + ' δ · +' + xp + ' XP · ' + eloTag(d) + '</p>' +
      '<p class="small muted" style="margin-bottom:16px">Meilleur score sur ce jeu : ' + S.games[jeu.id].best + ' / ' + rounds.length + ' · ' + S.games[jeu.id].parties + ' partie(s)</p>' +
      '<div class="row" style="justify-content:center">' +
      '<button class="btn p" id="again">Rejouer</button>' +
      '<button class="btn" id="back">Retour aux jeux</button></div></div>';
    if (win) burstAt(innerWidth / 2, 200, parfait ? 90 : 50);
    $('#again').onclick = () => runGame(host, jeu);
    $('#back').onclick = () => go('jeux');
  }

  function next(good) {
    if (good) { ok++; serie++; best = Math.max(best, serie); }
    else { serie = 0; vies--; }
    i++;
    if (vies <= 0 || i >= rounds.length) return finish();
    draw();
  }

  function feedback(zone, good, why, after) {
    zone.innerHTML = '<div class="fb ' + (good ? 'ok' : 'no') + '"><b>' + (good ? '✓ Exact' : '✕ Raté') + '</b>' +
      '<span class="why">' + (why || '') + '</span></div>' +
      '<button class="btn p" id="nx" style="margin-top:12px">Continuer</button>';
    $('#nx').onclick = after;
    if (good && serie >= 2) toast(serie + 1 + ' bonnes réponses d’affilée');
  }

  function draw() {
    const r = rounds[i];
    let body = '';
    if (r.ty === 'choice') {
      body = '<p class="q" style="font-size:17px;margin-bottom:14px">' + r.q + '</p>' +
        (r.indices ? '<div class="rep" style="margin-bottom:14px">' + r.indices.map((x, k) => '<div><b>Indice ' + (k + 1) + '</b>' + esc(x) + '</div>').join('') + '</div>' : '') +
        '<div class="opts">' + r.o.map((o, k) => '<button class="opt" data-k="' + k + '"><span class="mk">' + 'ABCD'[k] + '</span><span>' + esc(o) + '</span></button>').join('') + '</div>';
    } else if (r.ty === 'order') {
      body = '<p class="q" style="font-size:17px;margin-bottom:6px">' + r.q + '</p>' +
        '<p class="small muted" style="margin-bottom:14px">Clique sur les cartes dans l’ordre chronologique.</p>' +
        '<div class="friserow" id="pool">' + shuffle(r.o.map((x, k) => [x, k])).map(p =>
          '<button class="frisecard" data-k="' + p[1] + '">' + esc(p[0]) + '</button>').join('') + '</div>' +
        '<div class="slotrow" id="chosen" style="min-height:44px;margin-top:10px"></div>';
    } else if (r.ty === 'map') {
      const zones = mapZones(r.map, 0, 0, 2.4);
      body = '<p class="q" style="font-size:17px;margin-bottom:12px">' + r.q + '</p>' +
        '<div class="mapgame"><svg viewBox="0 0 244 250" xmlns="http://www.w3.org/2000/svg">' +
        (CARTES_BASE[r.map].mer ? '<rect x="0" y="0" width="244" height="250" fill="' + col('mer') + '"/>' : '') +
        zones.map(z => z.contours.map(pt => '<polygon class="zone" data-c="' + z.c + '" points="' + pt + '" fill="' + col('terre') + '" stroke="' + col('l') + '" stroke-width="1"/>').join('')).join('') +
        '</svg></div>';
    } else if (r.ty === 'slider') {
      body = '<p class="q" style="font-size:17px;margin-bottom:6px">' + r.q + '</p>' +
        '<div class="bigyear" id="yr">' + Math.round((r.min + r.max) / 2) + '</div>' +
        '<div class="slid"><input type="range" id="sl" min="' + r.min + '" max="' + r.max + '" value="' + Math.round((r.min + r.max) / 2) + '"></div>' +
        '<div class="axis"><span>' + r.min + '</span><span>' + r.max + '</span></div>' +
        '<button class="btn p wide" id="val" style="margin-top:16px">Valider</button>';
    }
    host.innerHTML = head() + '<div class="board">' + body + '<div id="fbz"></div></div>';
    const fbz = $('#fbz');

    if (r.ty === 'choice') {
      $$('.opt').forEach(b => b.onclick = () => {
        const k = +b.dataset.k, good = k === r.r;
        $$('.opt').forEach((o, j) => { o.disabled = true; if (j === r.r) o.classList.add('good'); else if (j === k) o.classList.add('wrong'); });
        feedback(fbz, good, r.w, () => next(good));
      });
    } else if (r.ty === 'order') {
      const chosen = [];
      const pool = $('#pool'), slot = $('#chosen');
      $$('.frisecard', pool).forEach(b => b.onclick = () => {
        b.classList.add('used'); b.style.display = 'none';
        chosen.push(+b.dataset.k);
        slot.innerHTML = chosen.map((k, p) => '<span class="frisecard on"><span class="yr">' + (p + 1) + '</span>' + esc(r.o[k]) + '</span>').join('');
        if (chosen.length === r.o.length) {
          const good = chosen.every((k, p) => k === p);
          $$('.frisecard', slot).forEach((el, p) => el.classList.add(chosen[p] === p ? 'good' : 'wrong'));
          feedback(fbz, good, r.w, () => next(good));
        }
      });
    } else if (r.ty === 'map') {
      $$('.zone').forEach(z => z.onclick = () => {
        const good = z.dataset.c === r.code;
        const cible = $$('.zone').find(x => x.dataset.c === r.code);
        z.classList.add(good ? 'good' : 'wrong');
        if (!good && cible) cible.classList.add('good');
        $$('.zone').forEach(x => x.style.pointerEvents = 'none');
        const nom = (CARTES_BASE[r.map].z.find(x => x.c === r.code) || {}).n || '';
        feedback(fbz, good, 'Réponse : <strong>' + esc(nom) + '</strong>.', () => next(good));
      });
    } else if (r.ty === 'slider') {
      const sl = $('#sl'), yr = $('#yr');
      sl.oninput = () => { yr.textContent = sl.value; };
      $('#val').onclick = () => {
        const v = +sl.value, ecart = Math.abs(v - r.r), good = ecart <= r.tol;
        sl.disabled = true; $('#val').disabled = true;
        yr.textContent = v; yr.style.color = good ? 'var(--ok)' : 'var(--bad)';
        feedback(fbz, good, r.w + (ecart ? ' Tu étais à ' + ecart + ' an(s).' : ' Pile dessus !'), () => next(good));
      };
    }
  }
  draw();
}

</script>
<script>

const coursDe = m => COURS.filter(c => c.m === m);
const exosDe = cid => EXOS.filter(e => e.c === cid);

/* ---------- rendu d'un cours ---------- */
function secHTML(s) {
  const t = s[0];
  switch (t) {
    case 'p': return '<p>' + s[1] + '</p>';
    case 'h': return '<h2 id="s' + hash(s[1]) + '">' + esc(s[1]) + '</h2>';
    case 'ul': return '<ul>' + s[1].map(x => '<li>' + x + '</li>').join('') + '</ul>';
    case 'ol': return '<ol style="margin:12px 0;padding-left:22px">' + s[1].map(x => '<li style="margin:7px 0">' + x + '</li>').join('') + '</ol>';
    case 'def': return '<div class="defs">' + s[1].map(d => '<div><b>' + esc(d[0]) + '</b> — ' + d[1] + '</div>').join('') + '</div>';
    case 'anec': return '<div class="anec"><b>Anecdote — ' + esc(s[1]) + '</b>' + s[2] + '</div>';
    case 'note': case 'callout': return '<div class="callout"><b>À noter</b>' + s[1] + '</div>';
    case 'keep': return '<div class="keep"><b>À retenir</b><ul>' + s[1].map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
    case 'doc': return '<div class="docsrc"><div class="dt">' + esc(s[1]) + '</div><blockquote>' + esc(s[2]) + '</blockquote>' +
      (s[3] ? '<div class="src">' + esc(s[3]) + '</div>' : '') + '</div>';
    case 'fig': return fig(s[1], s[2], s[3], s[4]);
    case 'atlas': {                       // une planche de l'atlas, reprise telle quelle
      const pl = ATLAS.find(x => x.id === s[1]);
      if (!pl) return '';
      return fig(pl.ops, pl.w, pl.h, s[2] || (pl.n + '.'));
    }
    case 'chiffres': return '<div class="figs">' + s[1].map(c => '<div><b>' + esc(c[0]) + '</b><span>' + esc(c[1]) + '</span></div>').join('') + '</div>';
    case 'tab': return '<table class="tab"><thead><tr>' + s[1].map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
      s[2].map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody>' +
      (s[3] ? '<caption>' + esc(s[3]) + '</caption>' : '') + '</table>';
    case 'rep': return '<div class="rep">' + s[1].map(r => '<div><b>' + esc(r[0]) + '</b><span>' + r[1] + '</span></div>').join('') + '</div>';
    default: return '';
  }
}

/* ---------- rendu d'un exercice ---------- */
function exoHTML(e, idx) {
  const lab = ['qcm', 'vf', 'txt', 'date', 'ord'];
  let body = '<p class="q">' + e.q + '</p>';
  if (e.ty === 'qcm') body += '<div class="opts">' + e.o.map((o, k) => '<button class="opt" data-k="' + k + '"><span class="mk">' + 'ABCDE'[k] + '</span><span>' + esc(o) + '</span></button>').join('') + '</div>';
  else if (e.ty === 'vf') body += '<div class="opts">' + e.o.map((o, k) =>
    '<div class="opt" style="cursor:default;align-items:center"><span style="flex:1">' + esc(o) + '</span>' +
    '<button class="btn sm vf" data-k="' + k + '" data-v="1">Vrai</button>' +
    '<button class="btn sm vf" data-k="' + k + '" data-v="0">Faux</button></div>').join('') +
    '</div><button class="btn p" id="vfgo" style="align-self:flex-start">Valider</button>';
  else if (e.ty === 'txt') body += '<div class="numin"><input class="txtin" id="ti" placeholder="Ta réponse…" autocomplete="off"><button class="btn p" id="tgo">Valider</button></div>';
  else if (e.ty === 'date') body += '<div class="numin"><input class="txtin" id="ti" inputmode="numeric" style="max-width:150px" placeholder="année" autocomplete="off"><button class="btn p" id="tgo">Valider</button></div>';
  else if (e.ty === 'ord') body += '<p class="small muted">Clique sur les propositions dans le bon ordre.</p>' +
    '<div class="friserow" id="opool">' + shuffle(e.o.map((x, k) => [x, k])).map(p => '<button class="frisecard" data-k="' + p[1] + '">' + esc(p[0]) + '</button>').join('') + '</div>' +
    '<div class="slotrow" id="ochosen" style="min-height:40px"></div>';
  return '<div class="exo" data-id="' + e.id + '">' +
    '<div class="row" style="gap:8px"><span class="pill ' + MAT[e.m].cls + '">' + MAT[e.m].n + '</span>' +
    '<span class="pill t-neutral">' + ['très facile', 'facile', 'moyen', 'difficile', 'costaud', 'expert'][e.d] + '</span>' +
    (S.exos[e.id] && S.exos[e.id].ok ? '<span class="pill t-ok">réussi</span>' : '') +
    '<span class="grow"></span><span class="eyebrow">' + (idx != null ? '#' + (idx + 1) : '') + '</span></div>' +
    body + '<div class="fbz"></div></div>';
}

function wireExo(node, e, onDone) {
  const fbz = $('.fbz', node);
  const done = (good) => {
    const prev = S.exos[e.id] || { ok: false, n: 0 };
    S.exos[e.id] = { ok: prev.ok || good, n: prev.n + 1 };
    S.stats.exoTot++; if (good) S.stats.exoOk++;
    const d = elo(e.d, good, 14);
    if (good) gain(8 + e.d * 4, 5 + e.d * 3);
    commit(); checkSucces();
    fbz.innerHTML = '<div class="fb ' + (good ? 'ok' : 'no') + '"><b>' + (good ? '✓ Bonne réponse' : '✕ Pas tout à fait') + '</b>' +
      '<span class="why">' + (e.w || '') + ' ' + eloTag(d) + '</span></div>';
    if (good) burstAt(innerWidth / 2, 220, 24);
    if (onDone) onDone(good);
  };

  if (e.ty === 'qcm') {
    $$('.opt', node).forEach(b => b.onclick = () => {
      const k = +b.dataset.k, good = k === e.r;
      $$('.opt', node).forEach((o, j) => { o.disabled = true; if (j === e.r) o.classList.add('good'); else if (j === k) o.classList.add('wrong'); });
      done(good);
    });
  } else if (e.ty === 'vf') {
    const rep = {};
    $$('.vf', node).forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      rep[k] = b.dataset.v === '1';
      $$('.vf', node).forEach(o => { if (+o.dataset.k === k) o.classList.remove('p'); });
      b.classList.add('p');
    });
    $('#vfgo', node).onclick = () => {
      if (Object.keys(rep).length < e.o.length) return toast('Réponds à chaque affirmation.');
      const good = e.r.every((v, k) => rep[k] === v);
      $$('.opt', node).forEach((o, k) => o.classList.add(rep[k] === e.r[k] ? 'good' : 'wrong'));
      $$('.vf', node).forEach(b => b.disabled = true);
      $('#vfgo', node).disabled = true;
      done(good);
    };
  } else if (e.ty === 'txt' || e.ty === 'date') {
    const go = () => {
      const v = $('#ti', node).value.trim();
      if (!v) return;
      const good = e.ty === 'date' ? (parseInt(v, 10) === e.r) : e.r.some(a => norm(a) === norm(v));
      $('#ti', node).disabled = true; $('#tgo', node).disabled = true;
      done(good);
    };
    $('#tgo', node).onclick = go;
    $('#ti', node).onkeydown = ev => { if (ev.key === 'Enter') go(); };
  } else if (e.ty === 'ord') {
    const chosen = [], pool = $('#opool', node), slot = $('#ochosen', node);
    $$('.frisecard', pool).forEach(b => b.onclick = () => {
      b.style.display = 'none'; chosen.push(+b.dataset.k);
      slot.innerHTML = chosen.map((k, p) => '<span class="frisecard on"><span class="yr">' + (p + 1) + '</span>' + esc(e.o[k]) + '</span>').join('');
      if (chosen.length === e.o.length) {
        const good = chosen.every((k, p) => k === p);
        $$('.frisecard', slot).forEach((el, p) => el.classList.add(chosen[p] === p ? 'good' : 'wrong'));
        done(good);
      }
    });
  }
}

/* ============================================================
   COURS
   ============================================================ */
VIEWS.cours = function (host, args) {
  if (args[1]) return lecteur(host, args[1]);
  const m = args[0] && MAT[args[0]] ? args[0] : null;
  const list = m ? coursDe(m) : COURS;
  const themes = [];
  list.forEach(c => { if (!themes.some(t => t[0] === c.th)) themes.push([c.th, []]); themes.find(t => t[0] === c.th)[1].push(c); });

  host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Cours</div>' +
    '<h1>' + (m ? MAT[m].n : 'Tout le programme') + '</h1>' +
    '<p>' + list.filter(c => S.cours[c.id]).length + ' chapitre(s) terminé(s) sur ' + list.length + '. Chaque chapitre contient des anecdotes, des cartes et un « à retenir ».</p></div></div>' +
    '<div class="tabs" style="margin-bottom:18px">' +
    '<button data-m="" class="' + (m ? '' : 'on') + '">Tout</button>' +
    ['hist', 'geo', 'emc'].map(k => '<button data-m="' + k + '" class="' + (m === k ? 'on' : '') + '">' + MAT[k].n + '</button>').join('') +
    '</div>' +
    themes.map(t => '<div class="navsec" style="padding-left:0">' + esc(t[0]) + '</div><div class="grid" style="margin-bottom:16px">' +
      t[1].map((c, k) => '<button class="chap' + (S.cours[c.id] ? ' is-done' : '') + '" data-id="' + c.id + '">' +
        '<span class="num">' + c.id.toUpperCase() + '</span>' +
        '<span style="flex:1"><h3>' + esc(c.t) + '</h3><p>' + esc(c.d) + '</p>' +
        '<span class="row" style="gap:6px;margin-top:6px"><span class="pill ' + MAT[c.m].cls + '">' + MAT[c.m].n + '</span>' +
        '<span class="pill t-neutral">' + exosDe(c.id).length + ' exercices</span></span></span>' +
        (S.cours[c.id] ? '<span class="done">✓</span>' : '') + '</button>').join('') + '</div>').join('');

  $$('[data-m]').forEach(b => b.onclick = () => go('cours' + (b.dataset.m ? '/' + b.dataset.m : '')));
  $$('.chap').forEach(b => b.onclick = () => { const c = coursById(b.dataset.id); go('cours/' + c.m + '/' + c.id); });
};

function lecteur(host, id) {
  const c = coursById(id);
  if (!c) { host.innerHTML = '<div class="panel">Chapitre introuvable.</div>'; return; }
  const same = coursDe(c.m), pos = same.indexOf(c);
  const acc = c.m === 'hist' ? 'var(--hist)' : c.m === 'geo' ? 'var(--geo)' : 'var(--emc)';
  const titres = c.sec.filter(s => s[0] === 'h').map(s => s[1]);

  host.innerHTML = '<div style="--acc:' + acc + '">' +
    '<div class="pagehead"><div class="grow">' +
    '<div class="row" style="gap:8px;margin-bottom:6px"><span class="pill ' + MAT[c.m].cls + '">' + MAT[c.m].n + '</span>' +
    '<span class="eyebrow">' + esc(c.th) + '</span></div>' +
    '<h1>' + esc(c.t) + '</h1><p>' + esc(c.d) + '</p>' +
    '<div class="row" style="gap:6px;margin-top:10px">' + (c.mo || []).map(k => '<span class="pill t-neutral">' + esc(k) + '</span>').join('') + '</div>' +
    '</div><button class="btn ghost" id="back">← Tous les cours</button></div>' +
    (titres.length > 2 ? '<div class="panel" style="margin-bottom:18px"><div class="eyebrow" style="margin-bottom:6px">Sommaire</div>' +
      titres.map(t => '<a href="#s' + hash(t) + '" style="display:inline-block;margin:3px 10px 3px 0;font-size:13.5px">' + esc(t) + '</a>').join('') + '</div>' : '') +
    '<div class="lesson">' + c.sec.map(secHTML).join('') + '</div>' +
    '<div class="lessnav">' +
    (pos > 0 ? '<button class="btn" id="prev">← ' + esc(same[pos - 1].t) + '</button>' : '') +
    '<span class="grow"></span>' +
    (S.cours[c.id] ? '<span class="pill t-ok">chapitre terminé</span>' : '<button class="btn p" id="done">J’ai lu ce chapitre</button>') +
    (pos < same.length - 1 ? '<button class="btn" id="next">' + esc(same[pos + 1].t) + ' →</button>' : '') +
    '</div>' +
    (exosDe(c.id).length ? '<div class="panel" style="margin-top:22px"><div class="row"><b>S’entraîner sur ce chapitre</b>' +
      '<span class="grow"></span><span class="small muted">' + exosDe(c.id).length + ' exercices</span></div>' +
      '<button class="btn p" id="toexos" style="margin-top:10px">Faire les exercices</button></div>' : '') +
    '</div>';

  $('#back').onclick = () => go('cours/' + c.m);
  if ($('#prev')) $('#prev').onclick = () => go('cours/' + c.m + '/' + same[pos - 1].id);
  if ($('#next')) $('#next').onclick = () => go('cours/' + c.m + '/' + same[pos + 1].id);
  if ($('#toexos')) $('#toexos').onclick = () => go('exos/' + c.id);
  if ($('#done')) $('#done').onclick = ev => {
    S.cours[c.id] = Date.now(); S.stats.lecons++;
    gain(35, 25, ev); commit(); checkSucces();
    toast('Chapitre terminé — +35 δ', 'win');
    route();
  };
}

/* ============================================================
   EXERCICES
   ============================================================ */
VIEWS.exos = function (host, args) {
  const filtre = args[0] || '';
  let list;
  if (filtre && coursById(filtre)) list = exosDe(filtre);
  else if (MAT[filtre]) list = EXOS.filter(e => e.m === filtre);
  else list = EXOS;

  const titre = coursById(filtre) ? coursById(filtre).t : (MAT[filtre] ? MAT[filtre].n : 'Tous les exercices');
  const ok = list.filter(e => S.exos[e.id] && S.exos[e.id].ok).length;

  host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Exercices</div>' +
    '<h1>' + esc(titre) + '</h1><p>' + ok + ' réussi(s) sur ' + list.length + '. Chaque bonne réponse rapporte des δ, de l’XP et des points Elo.</p></div>' +
    '<div class="stack" style="gap:8px;align-items:flex-end">' +
    '<button class="btn p" id="serie">Série aléatoire de 10</button>' +
    (filtre ? '<button class="btn sm" id="all">Voir tous les exercices</button>' : '') + '</div></div>' +
    '<div class="tabs" style="margin-bottom:18px"><button data-f="" class="' + (filtre ? '' : 'on') + '">Tout</button>' +
    ['hist', 'geo', 'emc'].map(k => '<button data-f="' + k + '" class="' + (filtre === k ? 'on' : '') + '">' + MAT[k].n + '</button>').join('') + '</div>' +
    '<div class="grid" id="lst"></div>';

  const lst = $('#lst');
  list.forEach((e, k) => {
    const d = document.createElement('div');
    d.innerHTML = exoHTML(e, k);
    const node = d.firstChild; lst.appendChild(node); wireExo(node, e);
  });
  $$('[data-f]').forEach(b => b.onclick = () => go('exos' + (b.dataset.f ? '/' + b.dataset.f : '')));
  if ($('#all')) $('#all').onclick = () => go('exos');
  $('#serie').onclick = () => serieExos(host, shuffle(list).slice(0, 10));
};

function serieExos(host, list) {
  let i = 0, ok = 0;
  function draw() {
    if (i >= list.length) {
      host.innerHTML = '<div class="board center"><div class="eyebrow">Série terminée</div>' +
        '<div class="score" style="margin:12px 0;color:' + (ok >= list.length * .6 ? 'var(--ok)' : 'var(--bad)') + '">' + ok + ' / ' + list.length + '</div>' +
        '<div class="row" style="justify-content:center"><button class="btn p" id="again">Nouvelle série</button>' +
        '<button class="btn" id="back">Retour</button></div></div>';
      $('#again').onclick = () => serieExos(host, shuffle(EXOS).slice(0, 10));
      $('#back').onclick = () => go('exos');
      if (ok >= list.length * .8) burstAt(innerWidth / 2, 200, 60);
      return;
    }
    const e = list[i];
    host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Série d’exercices</div>' +
      '<h1>Question ' + (i + 1) + ' / ' + list.length + '</h1></div>' +
      '<div class="bar" style="width:180px"><i style="width:' + Math.round(100 * i / list.length) + '%"></i></div></div>' +
      '<div id="slot"></div>';
    const d = document.createElement('div'); d.innerHTML = exoHTML(e);
    const node = d.firstChild; $('#slot').appendChild(node);
    wireExo(node, e, good => {
      if (good) ok++;
      const b = document.createElement('button');
      b.className = 'btn p'; b.textContent = 'Question suivante'; b.style.marginTop = '12px';
      b.onclick = () => { i++; draw(); };
      $('.fbz', node).appendChild(b);
    });
  }
  draw();
}

      }]
    ], 460, 150) + '</div>' +
    groupes.map(g => '<div class="navsec" style="padding-left:0">' + esc(g[0]) + '</div>' +
      '<div class="grid g3" style="margin-bottom:16px">' + g[1].map(d => {
        const k = d[0] + '|' + d[1];
        const on = (S.reperes || {})[k];
        return '<button class="chap' + (on ? ' is-done' : '') + '" data-k="' + esc(k) + '" style="flex-direction:column;align-items:flex-start;gap:4px">' +
          '<span class="mono" style="font-size:19px;font-weight:600;color:var(--brand)">' + d[0] + '</span>' +
          '<span style="font-family:var(--ff-b);font-size:14px">' + esc(d[1]) + '</span>' +
          '<span class="small muted">' + (on ? '✓ validé' : 'clique pour valider') + '</span></button>';
      }).join('') + '</div>').join('');

  $$('[data-k]').forEach(b => b.onclick = ev => {
    S.reperes = S.reperes || {};
    const k = b.dataset.k;
    if (S.reperes[k]) delete S.reperes[k];
    else { S.reperes[k] = 1; gain(4, 3, ev); }
    commit(); checkSucces(); route();
  });
  $('#quiz').onclick = () => runGame(host, jeuById('j-date'));
};

<script>
/* ============================================================
   Delta — tirage de fiches et collection.
   ============================================================ */
const PRIX_TIRAGE = 100, PRIX_TIRAGE10 = 900;
const PITIE = 30;        // un Monument garanti tous les 30 tirages
const PITIE_DEL = 150;   // une fiche Delta garantie tous les 150 tirages

function tirerRarete() {
  S.pity = (S.pity || 0) + 1; S.pityDel = (S.pityDel || 0) + 1;
  if (S.pityDel >= PITIE_DEL) { S.pityDel = 0; S.pity = 0; return 'del'; }
  if (S.pity >= PITIE) { S.pity = 0; return pick(['mon', 'mon', 'mon', 'leg']); }
  let r = Math.random() * 100, acc = 0;
  for (const x of RARETES) { acc += x.p; if (r < acc) { if (x.id === 'mon' || x.id === 'leg' || x.id === 'del') S.pity = 0; if (x.id === 'del') S.pityDel = 0; return x.id; } }
  return 'tra';
}
function tirerUne() {
  const rid = tirerRarete();
  const pool = CARTES.filter(c => c.r === rid);
  const c = pick(pool.length ? pool : CARTES);
  const neuf = !S.cards[c.id];
  S.cards[c.id] = (S.cards[c.id] || 0) + 1;
  S.rolls = (S.rolls || 0) + 1;
  const R = RAR(rid);
  const coins = neuf ? 0 : Math.round(R.coins * .5);
  S.coins += coins; S.xp += R.xp;
  commit();
  return { carte: c, neuf: neuf, rar: R, coins: coins };
}

function ficheHTML(c, poss, dup) {
  const R = RAR(c.r);
  return '<button class="fiche ' + R.cls + (poss ? '' : ' locked') + '" data-c="' + c.id + '">' +
    '<span class="band"><span class="code">' + c.id.toUpperCase() + '</span>' +
    '<span class="rname">' + esc(R.n) + '</span></span>' +
    (dup > 1 ? '<span class="dup">×' + dup + '</span>' : '') +
    '<span class="plate">' + figSVG(c.s, 200, 150) + '</span>' +
    '<span class="foot"><h4>' + (poss ? esc(c.n) : '???') + '</h4>' +
    '<span class="sub">' + MAT[c.m].n + '</span></span></button>';
}

function ficheDetail(c) {
  const R = RAR(c.r), poss = !!S.cards[c.id];
  modal('<div class="sheet ' + R.cls + '">' +
    '<div><div class="figure" style="margin:0">' + figSVG(c.s, 200, 150) + '</div>' +
    '<dl class="kv"><dt>Rareté</dt><dd style="color:var(--rc);font-weight:600">' + esc(R.n) + ' (' + R.p + ' %)</dd>' +
    '<dt>Matière</dt><dd>' + MAT[c.m].n + '</dd>' +
    '<dt>Exemplaires</dt><dd>' + (S.cards[c.id] || 0) + '</dd></dl></div>' +
    '<div><div class="eyebrow">' + esc(R.n) + '</div><h2 style="margin:4px 0 10px">' + esc(c.n) + '</h2>' +
    '<p class="small muted" style="font-family:var(--ff-b);font-size:15px;margin-bottom:12px">' + esc(c.d) + '</p>' +
    (poss ? '<div class="desc"><p>' + c.e + '</p></div>' +
      '<div class="keep" style="margin-top:14px"><b>Le point clé</b>' + esc(c.k) + '</div>'
      : '<div class="callout"><b>Fiche non débloquée</b>Fais un tirage pour découvrir son contenu.</div>') +
    '</div></div>');
}

/* ============================================================
   TIRAGE
   ============================================================ */
VIEWS.tirage = function (host) {
  const total = CARTES.length, poss = Object.keys(S.cards).length;
  host.innerHTML = '<div class="pagehead"><div class="grow"><div class="eyebrow">Tirage</div>' +
    '<h1>Tirage de repères</h1>' +
    '<p>Chaque fiche raconte un repère du programme : un lieu, un objet, un personnage, un événement. Six raretés, de la simple Trace à la fiche Delta.</p></div>' +
    '<div class="stack" style="gap:6px;align-items:flex-end">' +
    '<span class="stat coin"><b>' + nfmt(S.coins) + '</b> δ</span>' +
    '<span class="small muted">' + poss + ' / ' + total + ' fiches · ' + (S.rolls || 0) + ' tirage(s)</span></div></div>' +

    '<div class="grid g2" style="margin-bottom:18px">' +
    '<div class="panel center"><div class="eyebrow">Tirage simple</div>' +
    '<p class="muted small" style="font-family:var(--ff-b);margin:8px 0 12px">Une fiche au hasard.</p>' +
    '<button class="btn p big wide" id="t1">Tirer — ' + PRIX_TIRAGE + ' δ</button></div>' +
    '<div class="panel center"><div class="eyebrow">Tirage multiple</div>' +
    '<p class="muted small" style="font-family:var(--ff-b);margin:8px 0 12px">Dix fiches d’un coup, une remise de 100 δ.</p>' +
    '<button class="btn big wide" id="t10">Tirer ×10 — ' + PRIX_TIRAGE10 + ' δ</button></div></div>' +

    '<div class="panel" style="margin-bottom:18px"><div class="row" style="margin-bottom:10px"><b>Taux d’apparition</b>' +
    '<span class="grow"></span><span class="small muted">Monument garanti dans ' + (PITIE - (S.pity || 0)) + ' tirage(s) · Delta dans ' + (PITIE_DEL - (S.pityDel || 0)) + '</span></div>' +
    '<div class="grid g3">' + RARETES.map(r => {
      const n = CARTES.filter(c => c.r === r.id).length;
      const eu = CARTES.filter(c => c.r === r.id && S.cards[c.id]).length;
      return '<div class="' + r.cls + '" style="padding:10px 12px;border:1px solid color-mix(in srgb,var(--rc) 40%,transparent);border-radius:8px;background:color-mix(in srgb,var(--rc) 8%,var(--surface))">' +
        '<b style="color:var(--rc);font-size:13.5px">' + esc(r.n) + '</b>' +
        '<div class="mono small muted">' + r.p + ' % · ' + eu + '/' + n + ' obtenues</div></div>';
    }).join('') + '</div></div>' +
    '<div id="res"></div>';

  $('#t1').onclick = () => { if (!spend(PRIX_TIRAGE)) return; animUn(tirerUne()); };
  $('#t10').onclick = () => {
    if (!spend(PRIX_TIRAGE10)) return;
    const lot = Array.from({ length: 10 }, tirerUne);
    checkSucces();
    const meilleur = lot.reduce((a, b) => RARETES.findIndex(r => r.id === b.carte.r) > RARETES.findIndex(r => r.id === a.carte.r) ? b : a);
    $('#res').innerHTML = '<div class="panel"><div class="row" style="margin-bottom:12px"><b>Résultat du tirage ×10</b>' +
      '<span class="grow"></span><span class="small muted">' + lot.filter(l => l.neuf).length + ' nouvelle(s) · +' + lot.reduce((a, b) => a + b.coins, 0) + ' δ de doublons</span></div>' +
      '<div class="grid g4">' + lot.map(l => ficheHTML(l.carte, true, S.cards[l.carte.id])).join('') + '</div></div>';
    $$('[data-c]').forEach(b => b.onclick = () => ficheDetail(CARTES.find(c => c.id === b.dataset.c)));
    scrollTo({ top: 400, behavior: 'smooth' });
    if (['mon', 'leg', 'del'].indexOf(meilleur.carte.r) >= 0) burstAt(innerWidth / 2, 300, 80);
    paintBar();
  };
};

/* animation d'un tirage simple */
function animUn(res) {
  const R = res.rar, c = res.carte;
  const host = $('#res');
  host.innerHTML = '<div class="stage ' + R.cls + '" id="stage">' +
    (['mon', 'leg', 'del'].indexOf(c.r) >= 0 ? '<div class="rays"></div>' : '') +
    '<canvas id="fxc"></canvas><div class="orb"></div><div class="flare"></div>' +
    '<button class="btn ghost sm" id="skip" style="position:absolute;right:12px;top:12px">Passer</button></div>';
  scrollTo({ top: 300, behavior: 'smooth' });
  let fini = false;
  const reveal = () => {
    if (fini) return; fini = true;
    const st = $('#stage'); if (!st) return;
    st.innerHTML = (['mon', 'leg', 'del'].indexOf(c.r) >= 0 ? '<div class="rays"></div>' : '') +
      '<canvas id="fxc"></canvas>' +
      '<div class="reveal">' + ficheHTML(c, true, S.cards[c.id]) + '</div>' +
      '<div style="position:absolute;bottom:14px;left:0;right:0;text-align:center">' +
      '<span class="pill" style="color:var(--rc);border-color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,var(--surface))">' + esc(R.n) + '</span> ' +
      (res.neuf ? '<span class="pill t-ok">nouvelle fiche</span>' : '<span class="pill t-neutral">doublon · +' + res.coins + ' δ</span>') +
      '</div>';
    $$('[data-c]', st).forEach(b => b.onclick = () => ficheDetail(c));
    if (['arc', 'mon', 'leg', 'del'].indexOf(c.r) >= 0) {
      const cv = $('#fxc'); if (cv) fxBurst(cv, c.r);
      burstAt(innerWidth / 2, 320, c.r === 'del' ? 120 : 60);
    }
    checkSucces(); paintBar();
  };
  const t = setTimeout(reveal, 1450);
  $('#skip').onclick = () => { clearTimeout(t); reveal(); };
}
function fxBurst(cv, rid) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = cv.parentElement.getBoundingClientRect();
  cv.width = box.width; cv.height = box.height;
  const g = cv.getContext('2d');
  const cols = { arc: ['#2F5CB8', '#6E8FE4'], mon: ['#A9761A', '#DDA945'], leg: ['#9E2B7E', '#DC63B9'], del: ['#C2410C', '#CA8A04', '#0EA5A5'] }[rid] || ['#7A6A56'];
  const P = [];
  for (let i = 0; i < 70; i++) P.push({ x: cv.width / 2, y: cv.height / 2, vx: (Math.random() - .5) * 12, vy: (Math.random() - .5) * 12, r: 1.5 + Math.random() * 3, c: pick(cols), a: 1 });
  let t = 0;
  (function loop() {
    t++; g.clearRect(0, 0, cv.width, cv.height);
    for (const p of P) { p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy *= .96; p.a -= .015; g.globalAlpha = Math.max(0, p.a); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
    if (t < 80 && cv.isConnected) requestAnimationFrame(loop);
  })();
}

  const poss = CARTES.filter(c => S.cards[c.id]).length;

    '<h1>Collection de repères</h1>' +

    [['tout', 'Tout'], ['hist', 'Histoire'], ['geo', 'Géographie'], ['emc', 'EMC'], ['manquantes', 'Manquantes']]

      .map(x => '<button data-f="' + x[0] + '" class="' + (f === x[0] ? 'on' : '') + '">' + esc(x[1]) + '</button>').join('') + '</div>' +
    (list.length ? '<div class="grid g3">' + list.map(c => ficheHTML(c, !!S.cards[c.id], S.cards[c.id])).join('') + '</div>'
      : '<div class="panel center"><p style="font-family:var(--ff-b)">Rien à afficher ici — collection complète pour ce filtre !</p></div>');

  $$('[data-f]').forEach(b => b.onclick = () => go('collection/' + b.dataset.f));
  $$('[data-c]').forEach(b => {
    const c = CARTES.find(x => x.id === b.dataset.c);
    b.onclick = () => ficheDetail(c);
  });
};
